# FILE: jigu-app/.github/workflows/release.yml
#
# Builds the Windows artifacts and publishes them as a GitHub Release.
#
# How to trigger:
#   - push a version tag:   git tag v0.1.0 && git push origin v0.1.0
#     (tools/release.ps1 does exactly this: commit in VS Code, then run the task
#      "Jigu: release", or  powershell -NoProfile -File tools\release.ps1)
#   - or run this workflow manually from the Actions tab
#
# Why a Windows runner: the build uses the in-box .NET Framework compiler
# (csc.exe) plus PowerShell 5.1, both of which are present on windows-2022
# and need no extra setup.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win64
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发说的是「发布这个已存在的 tag」，不写 ref 就会检出默认分支的现状：
          # 构建出来的是主干代码，却挂着旧 tag 的名字发布出去。
          # tag 推送时 github.ref 本来就是该 tag，行为与从前一致。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "OS       : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          Write-Host "csc      : $csc (exists: $(Test-Path $csc))"
          if (-not (Test-Path $csc)) { throw 'in-box C# compiler is missing on this runner' }
          Write-Host "version  : $((Select-String -Path build.ps1 -Pattern '^\$version = "([^"]+)"').Matches[0].Groups[1].Value)"

      - name: Check the tag matches the version compiled in by build.ps1
        shell: pwsh
        run: |
          # 自动更新靠版本号比较来决定要不要提示用户，所以「tag」和「程序里认的版本」
          # 必须是同一个数。不一致的后果不是报错，而是发出去的包永远提示有新版本、
          # 装完又回到旧版本号，无限循环 —— 这里拦住它，比事后排查便宜得多。
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path build.ps1 -Pattern '^\$version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $tag = '${{ github.event.inputs.tag }}' }

          $expected = "v$ver"
          Write-Host "tag      : $tag"
          Write-Host "build.ps1: $ver (expected tag $expected)"
          if ($tag -ne $expected) {
            throw "tag '$tag' 与 build.ps1 里的版本号 '$ver' 不一致（应为 '$expected'）。先把 build.ps1 顶部的版本号改掉再打 tag。"
          }

      - name: Fetch the WebView2 SDK
        shell: pwsh
        run: |
          # The build only needs Microsoft.Web.WebView2.Core.dll,
          # Microsoft.Web.WebView2.WinForms.dll and WebView2Loader.dll.
          # A hosted runner has none of them, so pull the NuGet package into lib\.
          $ErrorActionPreference = 'Stop'
          $lib = Join-Path $PWD 'lib'
          New-Item -ItemType Directory -Force -Path $lib | Out-Null

          $index = Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json'
          $ver = $index.versions[-1]
          Write-Host "WebView2 SDK version: $ver"

          $nupkg = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile $nupkg
          Write-Host ("downloaded: {0:N1} KB" -f ((Get-Item $nupkg).Length / 1KB))

          $tmp = Join-Path $env:RUNNER_TEMP 'webview2'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -LiteralPath $nupkg -DestinationPath $tmp -Force

          Get-ChildItem $tmp -Recurse -Filter '*.dll' |
            Select-Object -First 40 |
            ForEach-Object { Write-Host ("  " + $_.FullName.Substring($tmp.Length + 1)) }

          # Do NOT hardcode the target-framework folder. The package has shipped lib\net45,
          # lib\net462 and others over time, and 1.0.4258.31 has ONLY lib\net462 -- a
          # hardcoded lib\net45 is exactly what broke the v0.2.0 build. Search for the file
          # instead, preferring the classic .NET Framework build (net4x) over the
          # netcore/lib_manual ones, newest net4x first.
          function Find-Sdk([string]$name) {
            $cands = @(Get-ChildItem (Join-Path $tmp 'lib') -Recurse -File -Filter $name -ErrorAction SilentlyContinue)
            if ($cands.Count -eq 0) { throw ("$name is not under lib\ in the SDK package -- see the listing above") }
            $net4 = @($cands | Where-Object { $_.Directory.Name -match '^net4\d' } |
                      Sort-Object { [int]($_.Directory.Name -replace '\D','') } -Descending)
            if ($net4.Count -gt 0) { return $net4[0].FullName }
            return $cands[0].FullName
          }

          Copy-Item (Find-Sdk 'Microsoft.Web.WebView2.Core.dll')     $lib -Force
          Copy-Item (Find-Sdk 'Microsoft.Web.WebView2.WinForms.dll') $lib -Force

          $loader = @(
            (Join-Path $tmp 'runtimes\win-x64\native\WebView2Loader.dll'),
            (Join-Path $tmp 'build\native\x64\WebView2Loader.dll')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $loader) { throw 'WebView2Loader.dll not found inside the SDK package' }
          Copy-Item $loader (Join-Path $lib 'WebView2Loader.dll') -Force

          Get-ChildItem $lib | Select-Object Name, Length | Format-Table -AutoSize

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JIGU_WEBVIEW2_DIR = Join-Path $PWD 'lib'
          & (Join-Path $PWD 'build.ps1')
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with $LASTEXITCODE" }

      - name: Verify the artifacts (smoke test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          # dist\ 里除了程序目录还有一个 ASCII 名的 update\（更新通道）。按枚举顺序
          # 取「第一个目录」会稳定拿到 update，于是下面去找 dist\update\update.exe，
          # 必然 Test-Path 失败、构建每次都挂 —— 必须显式排掉它。
          $appDirs = @(Get-ChildItem $dist -Directory | Where-Object { $_.Name -ne 'update' })
          if ($appDirs.Count -ne 1) {
            throw "expected exactly one app directory under dist (excluding 'update'), found $($appDirs.Count): $(($appDirs | ForEach-Object { $_.Name }) -join ', ')"
          }
          $appDir = $appDirs[0]
          $exe = Join-Path $appDir.FullName ($appDir.Name + '.exe')
          $zip = Get-ChildItem $dist -Filter '*.zip' | Select-Object -First 1
          $setup = Get-ChildItem $dist -Filter '*.exe' | Select-Object -First 1

          foreach ($f in @($exe, $zip.FullName, $setup.FullName)) {
            if (-not (Test-Path $f)) { throw "missing build output: $f" }
            Write-Host ("OK  {0,10:N0} B  {1}" -f (Get-Item $f).Length, $f)
          }

          # --selfcheck exercises the asset table, the external corpus and the C# search engine
          $report = Join-Path $env:RUNNER_TEMP 'selfcheck.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--selfcheck', $report -WorkingDirectory $appDir.FullName -PassThru -Wait
          Get-Content $report -ErrorAction SilentlyContinue | Write-Host
          if ($p.ExitCode -ne 0) { throw "selfcheck failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $report -Pattern 'SELFCHECK OK' -Quiet)) { throw 'selfcheck did not report SELFCHECK OK' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jigu-windows-${{ matrix.name }}
          if-no-files-found: error
          # dist/update/ 是 build.ps1 备好的「更新通道」目录，开发者本地可以整个把它
          # 当上传源用。这里只取四个清单/语料文件（它们会挂到 Release 上，让默认的
          # github: 源对程序本体和语料两条通道都零配置可用）；同目录里那份安装包副本
          # 与上面的 dist/*.exe 是同一个文件，不必重复上传。
          path: |
            dist/*.zip
            dist/*.exe
            dist/update/data_version.json
            dist/update/corpus.json
            dist/update/labels.json
            dist/update/stopwords.json

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全量历史：下面生成更新说明时要按 tag 取上一个版本到本版本之间的提交标题
          fetch-depth: 0
          # 与 build job 同一个理由：手动触发时要发的是那个 tag，不是默认分支的现状。
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then echo "no tag resolved"; exit 1; fi
          VER="$(grep -m1 -oE '^\$version = "[^"]+"' build.ps1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$TAG version=$VER"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          TAG="${{ steps.meta.outputs.tag }}"
          # ASCII asset names: they end up in download URLs, and CJK filenames
          # are awkward to link. The files themselves keep their Chinese names.
          ZIP=$(ls artifacts/*-portable.zip | head -n1)
          SETUP=$(ls artifacts/*.exe | head -n1)
          cp "$ZIP"   "release/jigu-portable-$TAG.zip"
          cp "$SETUP" "release/jigu-installer-$TAG.exe"
          # 语料通道：清单与三个数据文件跟着同一个 Release 走。默认更新源是
          # github:1279255198psy/jigu-app，所以程序本体和语料两条通道
          # 都不需要额外配置任何服务器。
          # upload-artifact 会按公共父目录保留层级（这四个文件落在 update/ 下），
          # 但那是它的实现细节，用 find 兜住；后面逐个检查，漏挂一定报错。
          find artifacts -name '*.json' -exec cp {} release/ \;
          for f in data_version.json corpus.json labels.json stopwords.json; do
            [ -f "release/$f" ] || { echo "缺少更新通道文件：$f"; exit 1; }
          done
          ls -l release
          # SHA256SUMS.txt 留到 app_version.json 生成之后再算，让它也覆盖到该文件

      - name: Generate app_version.json (the update manifest)
        shell: bash
        run: |
          set -euo pipefail
          export TAG="${{ steps.meta.outputs.tag }}"
          export VERSION="${{ steps.meta.outputs.version }}"
          # 这份清单是自动更新唯一的「新版本在哪」的来源。程序优先读它，
          # 读不到才回退到「按 tag + 附件名 + SHA256SUMS.txt 推导」，两条路都通。
          # url 写成附件名而不写死绝对地址：程序会拿它去 Release 的附件表里查
          # browser_download_url，地址随附件漂移也不会失效。
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          installer = "jigu-installer-%s.exe" % tag

          path = os.path.join("release", installer)
          if not os.path.isfile(path):
              raise SystemExit("找不到已放置的安装包：" + path)

          with open(path, "rb") as fh:
              sha = hashlib.sha256(fh.read()).hexdigest()


          def notes_from_changelog():
              """CHANGELOG.md 里该版本的小节（比提交标题更像给人看的更新说明）"""
              if not os.path.isfile("CHANGELOG.md"):
                  return ""
              head = re.compile(r"^##(?!#)\s*\[?v?" + re.escape(version) + r"\b")
              out, keep = [], False
              with open("CHANGELOG.md", encoding="utf-8") as fh:
                  for line in fh:
                      line = line.rstrip()
                      if re.match(r"^##(?!#)", line.strip()):
                          if keep:
                              break
                          keep = bool(head.match(line.strip()))
                      elif keep:
                          out.append(line.strip())
              return "\n".join(out).strip()


          def notes_from_commits():
              """上一个 tag 到本 tag 之间的提交标题（仓库没有 CHANGELOG.md 时的主力）"""
              def run(args):
                  try:
                      return subprocess.run(args, capture_output=True, text=True,
                                            timeout=60).stdout.strip()
                  except Exception:
                      return ""
              prev = run(["git", "describe", "--tags", "--abbrev=0", tag + "^"])
              if not prev:
                  return ""
              log = run(["git", "log", "--no-merges", "--pretty=format:%s", prev + ".." + tag])
              subs = [s.strip() for s in log.splitlines() if s.strip()]
              return "\n".join("· " + s for s in subs[:6])


          # 这段说明会原样出现在「新版本已下载完成」的弹窗里，长了没法看。
          notes = notes_from_changelog() or notes_from_commits() or ("稽古 %s 发布" % tag)
          notes = re.sub(r"\n{3,}", "\n\n", notes).strip()
          if len(notes) > 600:
              notes = notes[:599].rstrip() + "…"

          manifest = {
              "version": version,
              "url": installer,
              "sha256": sha,
              "notes": notes,
              "mandatory": False,
          }
          text = json.dumps(manifest, ensure_ascii=False, indent=2)
          with open("release/app_version.json", "w", encoding="utf-8") as fh:
              fh.write(text + "\n")
          print(text)
          PY
          # 现在算总和：app_version.json 已就位，校验和文件把 Release 上的每个文件都覆盖到
          (cd release && sha256sum * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          cat release/app_version.json

      - name: Write release notes
        shell: bash
        run: |
          cat > release-body.md <<'EOF'
          ## 稽古 · 二十四史情境检索

          用中文写下你眼下的现实困境，程序在本机检索 201 则史事，给出最相似的三条，
          每条含 **原文摘录 · 现代文翻译 · 核心人物 · 关键决策 · 最终结果**，并附规则生成的分析。
          **运行时不调用任何 AI 接口，检索全部在本机完成。**

          ### 下载哪个

          | 文件 | 适用 |
          | --- | --- |
          | `jigu-installer-*.exe` | 普通用户：双击安装，会创建桌面与开始菜单快捷方式 |
          | `jigu-portable-*.zip` | 免安装：解压到任意目录，双击里面的 `稽古.exe` |

          ### 系统要求

          - Windows 7 SP1 及以上（64 位），无需安装 .NET 或任何运行环境
          - 界面依赖 Microsoft Edge WebView2 Runtime；Windows 10/11 一般自带，
            缺失时程序会询问是否一键安装。**即使不装也能用**：程序会自动改用内置原生界面

          ### 校验下载

          ```
          certutil -hashfile jigu-installer-<tag>.exe SHA256
          ```

          与 `SHA256SUMS.txt` 中的值比对。

          ### 首次运行

          1. 打开程序，在输入框写下困扰你的处境（人物关系、时间压力、你已经做了什么，越具体越好）
          2. 点「稽古一问」，等待约 10 毫秒
          3. 看三条史事与下方的分析、要避免的做法、可行动作

          完整说明见仓库里的 `README.md` 与 `使用说明.txt`。

          ---
          *完整改动记录见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/CHANGELOG.md)*
          EOF
          # 去掉 heredoc 的缩进（EOF 用了缩进形式）
          sed -i 's/^          //' release-body.md
          head -20 release-body.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "稽古 ${{ steps.meta.outputs.tag }}" \
            --notes-file release-body.md \
            release/*
