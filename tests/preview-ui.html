<!DOCTYPE html>
<!-- FILE: jigu-app/web/index.html -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>稽古 · 界面预览</title>
  <style>
/* FILE: jigu-app/web/styles.css
   稽古 · 古风界面：宣纸底色 / 墨黑文字 / 朱砂点缀 / 卷轴输入 / 线装书卡片 */

:root {
  --paper: #f8f5ee;
  --paper-2: #f2ede1;
  --paper-3: #ebe4d5;
  --ink: #2b2a26;
  --ink-soft: #55524a;
  --ink-faint: #857f72;
  --line: #d9d1bf;
  --line-soft: #e6dfd0;
  --cinnabar: #c0392b;
  --cinnabar-soft: #d4635a;
  --jade: #4a7c59;
  --radius: 4px;
  --font-classic: "KaiTi", "STKaiti", "Kaiti SC", "SimSun", "Songti SC", "Noto Serif SC",
    Georgia, serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  /* 宣纸底色 + 极淡纤维纹理（纯 CSS，无图片依赖） */
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(0deg, rgba(160, 140, 100, 0.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(160, 140, 100, 0.025) 0 1px, transparent 1px 4px),
    radial-gradient(900px 500px at 50% -180px, rgba(192, 57, 43, 0.045), transparent 70%);
  color: var(--ink);
  font-family: var(--font-classic);
  font-size: 16px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 26px 22px 34px;
}

/* ---------- 抬头：朱砂印 + 书名 ---------- */
.masthead {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 14px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
  position: relative;
}

.masthead::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 92px;
  height: 2px;
  background: var(--cinnabar);
  opacity: 0.75;
}

.seal {
  flex: none;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  background: var(--cinnabar);
  color: #fdf9f0;
  font-size: 27px;
  line-height: 1;
  border-radius: 3px;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.28), 0 1px 2px rgba(120, 40, 30, 0.28);
  letter-spacing: 0;
  user-select: none;
}

.masthead h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 400;
  letter-spacing: 0.34em;
  color: var(--ink);
}

.tabs {
  margin-left: auto;
  display: flex;
  gap: 2px;
}

.tab {
  border: 0;
  background: transparent;
  font-family: inherit;
  font-size: 15.5px;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
  padding: 5px 13px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 0.25s, border-color 0.25s;
}

.tab:hover { color: var(--cinnabar); }

.tab.active {
  color: var(--cinnabar);
  border-bottom-color: var(--cinnabar);
}

/* ---------- 状态一行 ---------- */
.statusline {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  color: var(--ink-faint);
  padding: 2px 2px 14px;
  min-height: 24px;
}

.statusline .pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cinnabar-soft);
  flex: none;
  animation: inkpulse 2s ease-in-out infinite;
}

.statusline .pulse.ready { background: var(--jade); animation: none; }
.statusline .pulse.warn { background: var(--cinnabar); animation: none; }

@keyframes inkpulse {
  0%, 100% { opacity: 0.35; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.15); }
}

/* 状态一行 + 右侧的「去藏书阁选书」。后者只在「装了分册但一部都没勾」时出现 */
.statusbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
}

.statusbar .statusline { flex: 1 1 auto; }

/* ---------- 首次运行引导（看过一次就不再出现） ---------- */
.guide {
  background: #fffdf8;
  border: 1px solid var(--line-soft);
  border-left: 3px solid var(--cinnabar);
  border-radius: var(--radius);
  padding: 16px 20px 10px;
  margin-bottom: 18px;
}

.guide-text {
  margin: 0;
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink-soft);
  letter-spacing: 0.03em;
}

.guide .row { margin-top: 6px; }

/* ---------- 通用 ---------- */
.main { display: flex; flex-direction: column; gap: 20px; }

.card {
  background: #fffdf8;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: 0 1px 2px rgba(90, 76, 50, 0.05);
}

.sec-title {
  margin: 0 0 12px;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.22em;
  color: var(--cinnabar);
}

.hint { font-size: 13px; color: var(--ink-faint); letter-spacing: 0.04em; }
.small { font-size: 12.5px; }
.mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; word-break: break-all; }

button { font-family: inherit; }

/* ---------- 卷轴式输入区 ---------- */
.scroll { margin-bottom: 4px; }

.rod {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(180deg, #cbb894 0%, #b9a67f 45%, #a8916a 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 1px 3px rgba(90, 76, 50, 0.22);
  position: relative;
}

.rod::before, .rod::after {
  content: "";
  position: absolute;
  top: -3px;
  width: 8px;
  height: 18px;
  border-radius: 4px;
  background: linear-gradient(180deg, #8d7a56, #6f5f42);
}

.rod::before { left: -4px; }
.rod::after { right: -4px; }

.scroll-body {
  /* 卷身：宣纸质感 + 内阴影，像被卷起的纸面 */
  background:
    linear-gradient(180deg, rgba(190, 170, 130, 0.16), rgba(255, 255, 255, 0) 22%),
    #fdfbf4;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  box-shadow: inset 0 10px 18px -12px rgba(90, 76, 50, 0.4);
  padding: 16px 20px 18px;
}

.scroll-body label {
  display: block;
  font-size: 13.5px;
  letter-spacing: 0.3em;
  color: var(--cinnabar);
  margin-bottom: 6px;
}

textarea {
  width: 100%;
  background: transparent;
  color: var(--ink);
  border: 0;
  border-radius: 0;
  padding: 4px 2px;
  font-family: inherit;
  font-size: 17px;
  line-height: 1.95;
  resize: vertical;
  min-height: 108px;
  outline: none;
}

textarea::placeholder { color: #b3aa98; }

.row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- 朱砂按钮 + 墨迹晕染 ---------- */
.seal-btn {
  position: relative;
  overflow: hidden;
  border: 1px solid #a5301f;
  border-radius: 3px;
  padding: 9px 30px;
  font-size: 17px;
  letter-spacing: 0.24em;
  color: #fdf9f0;
  background: var(--cinnabar);
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.3s ease, background 0.3s ease;
  box-shadow: 0 1px 3px rgba(140, 45, 30, 0.28);
}

.seal-btn::before {
  /* 墨迹晕染 */
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%);
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  pointer-events: none;
}

.seal-btn:disabled {
  background: #d8cfbd;
  border-color: #c8bfab;
  color: #fbf8f1;
  cursor: default;
  box-shadow: none;
}

.seal-btn:not(:disabled):hover {
  background: #b0301f;
  box-shadow: 0 3px 10px rgba(140, 45, 30, 0.3);
}

.seal-btn:not(:disabled):active { transform: scale(0.97); }

.seal-btn.inking::before { animation: inkSpread 0.75s ease-out; }

@keyframes inkSpread {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0.9; }
  60% { opacity: 0.35; }
  100% { transform: translate(-50%, -50%) scale(22); opacity: 0; }
}

button.ghost {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 6px 16px;
  font-size: 14.5px;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.22s;
}

button.ghost:hover {
  border-color: var(--cinnabar);
  color: var(--cinnabar);
  background: rgba(192, 57, 43, 0.04);
}

button.link {
  background: none;
  border: 0;
  color: var(--cinnabar);
  cursor: pointer;
  font-family: inherit;
  font-size: 13.5px;
  padding: 2px 0;
  text-decoration: underline dotted;
  text-underline-offset: 4px;
}

/* ---------- 示例 ---------- */
.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #fffdf8;
  border: 1px solid var(--line-soft);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 2px 11px;
  font-size: 13px;
  white-space: nowrap;
}

.chip em { font-style: normal; color: var(--cinnabar); font-size: 11.5px; }
.chip i { font-style: normal; color: var(--jade); font-size: 10.5px; }
.chip-syn { border-color: rgba(74, 124, 89, 0.45); }
.chip-mini { padding: 1px 8px; font-size: 12px; margin-right: 5px; }

.chip-btn {
  cursor: pointer;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.2s;
}

.chip-btn:not(:disabled):hover {
  border-color: var(--cinnabar-soft);
  color: var(--cinnabar);
  background: rgba(192, 57, 43, 0.05);
}

.chip-btn:disabled { opacity: 0.5; cursor: default; }

/* ---------- 解字 ---------- */
.explain { padding: 2px 2px; }
.explain-body p { margin: 5px 0; font-size: 13.5px; color: var(--ink-faint); }

/* ---------- 结果：线装书页 ---------- */
.results { display: flex; flex-direction: column; gap: 20px; }

.took {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-faint);
  text-align: center;
  letter-spacing: 0.08em;
}

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 0 2px;
}

.section-title h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 0.24em;
  color: var(--cinnabar);
}

.hit-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: #fffdf8;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 20px 22px 20px 30px;
  box-shadow: 0 1px 3px rgba(90, 76, 50, 0.06);
}

/* 线装书的装订线 */
.hit-card::before {
  content: "";
  position: absolute;
  left: 13px;
  top: 16px;
  bottom: 16px;
  width: 1px;
  background: repeating-linear-gradient(
    180deg, var(--line) 0 7px, transparent 7px 14px);
}

/* 朱砂书脊 */
.hit-card::after {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  bottom: 18px;
  width: 3px;
  background: var(--cinnabar);
  opacity: 0.85;
  border-radius: 0 2px 2px 0;
}

.hit-head { display: flex; align-items: flex-start; gap: 12px; }

.rank {
  flex: none;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid var(--cinnabar);
  border-radius: 2px;
  color: var(--cinnabar);
  font-size: 14px;
  line-height: 1;
}

.hit-title { flex: 1; min-width: 0; }

.hit-title h3 {
  margin: 0;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--ink);
}

.hit-sub {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
}

.conf { color: var(--jade); }

.score {
  flex: none;
  font-family: Consolas, monospace;
  font-size: 11.5px;
  color: var(--ink-faint);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 1px 7px;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.block h4 {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.26em;
  color: var(--cinnabar);
}

.quote {
  margin: 0;
  padding: 12px 16px;
  background: var(--paper-2);
  border-left: 2px solid var(--cinnabar-soft);
  border-radius: 0 3px 3px 0;
  font-size: 17px;
  line-height: 2.05;
  color: var(--ink);
  white-space: pre-wrap;
}

.prose { margin: 0; color: var(--ink-soft); font-size: 15.5px; line-height: 1.95; }

.prose.outcome {
  border-left: 2px solid var(--line);
  padding-left: 12px;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* ---------- 三栏：上中下三策（无档位时叫「三次相似的处境」） ---------- */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: start; }

/* 不复用 .hit-card：它的装订线 ::before 与朱砂书脊 ::after 是整页级装饰，
   三栏并排嵌套会重复出现，观感变厚。这里只保留左侧一道细分隔线。 */
.plan-col {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #fffdf8;
  border: 1px solid var(--line-soft);
  border-left: 3px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: 0 1px 3px rgba(90, 76, 50, 0.06);
}

.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.plan-badge {
  flex: none;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 1px 9px;
  font-size: 13px;
  line-height: 1.7;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
}

/* 三档配色只落在现有变量里，不引入新色：上=玉（赞成），中=墨（中性），下=朱砂（代价） */
.plan-badge.plan-up { border-color: var(--jade); color: var(--jade); }
.plan-badge.plan-mid { border-color: var(--ink-faint); color: var(--ink-soft); }
.plan-badge.plan-down { border-color: var(--cinnabar); color: var(--cinnabar); }

.plan-col.plan-up { border-left-color: var(--jade); }
.plan-col.plan-mid { border-left-color: var(--ink-faint); }
.plan-col.plan-down { border-left-color: var(--cinnabar); }

.plan-title h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0.08em;
  line-height: 1.6;
  color: var(--ink);
}

.plan-verdict-why {
  margin: 0;
  padding-left: 10px;
  border-left: 2px solid var(--line);
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--ink-soft);
}

/* 空档：如实说明没找到，不拿无关史料顶替 */
.plan-col.empty {
  background: transparent;
  border-style: dashed;
  border-left-color: var(--line);
  box-shadow: none;
  justify-content: flex-start;
}

.plan-empty-text { margin: 6px 0 0; font-size: 14.5px; color: var(--ink-faint); }

.plan-empty-note { margin: 0; font-size: 12.5px; line-height: 1.8; color: var(--ink-faint); }

.plan-expand {
  align-self: flex-start;
  margin-top: 2px;
  padding: 3px 14px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--cinnabar);
  background: transparent;
  border: 1px solid var(--cinnabar-soft);
  border-radius: 2px;
  cursor: pointer;
}

.plan-expand:hover { background: rgba(192, 57, 43, 0.06); }

.hit-detail { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
.hit-detail[hidden] { display: none; }

/* ---------- 处境识别条 ---------- */
.situation-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  padding: 10px 14px;
  background: var(--paper-2);
  border-left: 3px solid var(--cinnabar-soft);
  border-radius: var(--radius);
  font-size: 13.5px;
  color: var(--ink-soft);
}

.situation-lead { color: var(--ink-faint); letter-spacing: 0.1em; }

/* ---------- 为什么给你看这条 ---------- */
.why-list { list-style: none; margin: 0; padding: 0; }

.why-list li {
  display: block;
  margin-bottom: 4px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-soft);
}

.why-said { color: var(--ink); }

.why-arrow { margin: 0 7px; color: var(--ink-faint); }

.why-label { color: var(--cinnabar); }

.figures { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }

.figures li {
  background: var(--paper-2);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 1px 10px;
  font-size: 14px;
  color: var(--ink);
}

.muted { color: var(--ink-faint); }

/* cast 带身份角色（「项羽（西楚霸王·主帅）」）比人名裸串长，让它整条占一行更好读 */
.figures.cast li { font-size: 13.5px; padding: 2px 10px; }

/* ---------- 标注：起因 / 经过 / 现实意义 ---------- */
.decision-body > .prose { margin: 0; }

.anno-row {
  display: flex;
  gap: 10px;
  margin: 8px 0 0;
  font-size: 14.5px;
  line-height: 1.85;
  color: var(--ink-soft);
}

.anno-label {
  flex: 0 0 auto;
  color: var(--ink-faint);
  letter-spacing: 0.16em;
  font-size: 12.5px;
  padding-top: 2px;
}

.anno-text { flex: 1 1 auto; }

/* 现实意义与「决策分析」同为收尾板块，用同一道细线跟正文分开 */
.block .significance {
  border-left: 2px solid var(--cinnabar);
  padding-left: 12px;
}

/* ---------- 决策分析栏 ---------- */
.analysis { border-top: 1px solid var(--line-soft); padding-top: 14px; }

.analysis-lead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  margin: 0 0 14px;
  font-size: 13.5px;
  color: var(--ink-soft);
}

.chips.inline { display: inline-flex; }

.chip-on {
  border-color: var(--cinnabar);
  color: var(--cinnabar);
  background: rgba(192, 57, 43, 0.06);
}

.chip-off { color: var(--ink-faint); }

.pros, .cons { list-style: none; margin: 0; padding: 0; }

.pros li, .cons li {
  position: relative;
  padding-left: 18px;
  margin-bottom: 7px;
  font-size: 14.5px;
  line-height: 1.85;
  color: var(--ink-soft);
}

.pros li::before, .cons li::before {
  position: absolute;
  left: 0;
  top: 0;
  font-size: 12px;
}

.pros li::before { content: "\25CB"; color: var(--jade); }
.cons li::before { content: "\25CF"; color: var(--cinnabar); }

.analysis-note {
  margin: 12px 0 0;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--ink-faint);
}

.reason {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-faint);
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}

.hit-foot { font-size: 11.5px; color: #a79f8f; word-break: break-all; }

/* ---------- 建议：朱批 ---------- */
.advice-panel { display: flex; flex-direction: column; gap: 18px; }

.advice-card {
  background: #fffdf8;
  border: 1px solid var(--line-soft);
  border-top: 2px solid var(--cinnabar);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: 0 1px 3px rgba(90, 76, 50, 0.06);
}

.advice-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }

.advice-head h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--cinnabar);
}

.advice-tags { display: flex; flex-wrap: wrap; }

.mirror {
  margin: 12px 0 0;
  padding: 12px 16px;
  background: var(--paper-2);

window.__CORPUS__ = { book: "corpus", items: [{"book":"种子","chapter":"史记·项羽本纪","title":"陈平反间，范增去楚","original":"项王乃疑范增与汉有私，稍夺其权。范增大怒，曰：「天下事大定矣，君王自为之。愿赐骸骨归卒伍。」项王许之。范增行未至彭城，疽发背而死。","translation":"项羽怀疑范增与汉军私下往来，逐渐削夺他的权力。范增大怒说：「天下大势已定，君王自己干吧，请让我这把老骨头回家。」项羽答应了。范增还没走到彭城，背上的毒疮发作而死。","figures":["项羽","范增","陈平","刘邦"],"decision":"中陈平反间之计，怀疑并削夺首席谋臣范增的权柄，放任其负气离去","outcome":"范增死于途中，楚军失去唯一能制衡项羽决策的人，四年后垓山兵败自刎","themes":["内部矛盾","猜忌","谗言构陷","骨干离职","将帅不和","内部分裂","反间","疏远谋臣","上下离心"],"pros":["削去范增对军权的掣肘，项羽得以独断，短期内无人能当面否决他的部署。","清掉与汉有旧的老人，楚军上下口径统一，主战路线不再被内部拉扯。","只花一笔反间的钱就除掉对手最难对付的人，出手极省。"],"cons":["刘邦用一封信换走了楚军唯一的战略大脑，这笔交换项羽是亏的。","范增一死，再没人敢在项羽盛怒时拦住他的错着，后面每一步都无人纠偏。","逼走老臣等于告诉全军功高者必被疑，此后留下的多是顺从而非可用的人。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·高祖本纪","title":"约法三章","original":"与父老约，法三章耳：杀人者死，伤人及盗抵罪。余悉除去秦法。秦人大喜，争持牛羊酒食献飨军士。","translation":"刘邦与关中父老约定，法律只有三条：杀人者处死，伤人及盗窃者抵罪。其余秦朝苛法全部废除。秦地百姓大喜，争相带着牛羊酒食来犒劳将士。","figures":["刘邦","关中父老"],"decision":"废除秦朝苛法，只保留三条简明规则，并公开向全体用户（百姓）承诺","outcome":"关中民心归附，刘邦由此获得稳固的后方与兵源，最终以此为基础统一天下","themes":["定制度","宽政","民心","约法三章","收揽人心","明法度"],"pros":["三条规则人人记得住，执行成本极低，秦地百姓立刻明白苛法已去。","公开承诺把自己绑在信用上，此后征粮征兵都有父老愿意配合。","把秦法的账转嫁给旧朝，关中从被征服地变成可靠的后方与兵源。"],"cons":["简法能收心却不能治事，真正管起赋税刑狱仍要另立细文，承诺会被迫打折。","三条只覆盖杀人伤盗，豪强兼并、旧吏贪墨这些积弊一件都没碰。","这份承诺只在刘邦守得住关中的时候才算数，守不住时父老未必认账。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·高祖本纪","title":"三不如：用人的自认","original":"夫运筹策帷帐之中，决胜于千里之外，吾不如子房；镇国家，抚百姓，给馈饷，不绝粮道，吾不如萧何；连百万之军，战必胜，攻必取，吾不如韩信。此三者，皆人杰也，吾能用之，此吾所以取天下也。","translation":"在营帐中谋划、决定千里之外胜负，我不如张良；安定国家、抚慰百姓、供给粮饷不断，我不如萧何；统领百万大军、战必胜攻必取，我不如韩信。这三人都是人中豪杰，我能任用他们，这就是我取得天下的原因。","figures":["刘邦","张良","萧何","韩信"],"decision":"公开承认自己在三个关键能力上不如下属，并把决策权与资源交给专业者","outcome":"形成一个互补的核心团队，刘邦由弱势一方转为最终胜者","themes":["招才","用人","举贤","任用贤能","不拘一格","纳士","招贤"],"pros":["把三件最要紧的事交给最懂的人，自己只管接住人与事，决策吞吐成倍放大。","公开认短让下属确信功劳不会被冒领，张良萧何韩信肯把本事全用出来。","承认不懂就不插手具体打法，避免了外行指挥内行造成的反复。"],"cons":["权分出去就收不回，韩信这类人有能力也有动机在形势变化时另立门户。","这套结构靠刘邦一人在位维持平衡，他一走，功臣之间就会直接对撞。","把国运系于三个人的忠诚，其中任何一个被逼走或被疑，位置都补不上。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·淮阴侯列传","title":"萧何月下追韩信","original":"何闻信亡，不及以闻，自追之。居一二日，何来谒上。上曰：「若所追者谁？」何曰：「韩信也。」上骂曰：「诸将亡者以十数，公无所追；追信，诈也。」何曰：「诸将易得耳。至如信者，国士无双。」","translation":"萧何听说韩信逃走，来不及报告就亲自去追。过了两天回来见刘邦。刘邦问追的是谁，萧何说是韩信。刘邦骂道：逃走的将领几十个你都不追，追韩信是骗我。萧何说：那些将领容易得到，至于韩信，是国士无双。","figures":["萧何","韩信","刘邦"],"decision":"萧何越权承担风险追回一个尚未证明价值的年轻管理者，并力荐其担任最高军事负责人","outcome":"韩信被拜为大将，定三秦、破赵齐、垓下灭楚，成为汉朝立国的关键人物","themes":["招才","用人","识人","骨干离职","举贤","人才流失","不拘一格","骨干流失","任用贤能"],"pros":["追的是别人都不追的人，等于在最便宜的时候买入最贵的资产。","不惜越权亲自去追，让韩信看到自己被当成国士，归附的忠诚远高于按流程招来。","一句国士无双把举荐责任押在自己身上，刘邦因此肯破格给最高军职。"],"cons":["越权离岗去追人，若韩信不归或中途出事，萧何先背上擅离职守的罪。","举荐人把信用全押上去，韩信日后若有反复，萧何必须跟着一起承担。","破格拜将绕过按功升迁的次序，逃走的十几个老将心里的账未必服。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"三国志·魏书·武帝纪","title":"赤壁：优势方的误判","original":"公至赤壁，与备战，不利。于是大疫，吏士多死者，乃引军还。","translation":"曹操到赤壁与刘备交战，失利。当时军中发生大疫，官兵死了很多，于是率军退回。","figures":["曹操","周瑜","刘备","孙权"],"decision":"在收降荆州水军后，以新附之众仓促南下，低估江东抵抗意志与水土疫病风险","outcome":"水军被火攻大破，疫病流行，统一进程推迟数十年，形成三国鼎立","themes":["识人","误判","轻敌","骄兵","失察","不知彼","料敌失误","疏于防备"],"pros":["兵不血刃收降荆州水军，短时间内把长江水师补齐，是当时最快的南进方案。","挟平定北方之势南下，江东若不战而降，统一可一次完成，成本远低于逐次用兵。","携大胜之威压境，本身就能吓退一部分观望的江东守将。"],"cons":["新附的荆州兵不肯为曹操死战，水战又不熟，人数优势在江面转不成胜势。","北方士卒不服水土，疫病一起未战先损，主帅想打也组织不起来。","低估江东在自家门口死战的意志，把政治劝降当成必然，好牌打成退兵。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·越王勾践世家","title":"卧薪尝胆","original":"吴既赦越，越王勾践反国，乃苦身焦思，置胆于坐，坐卧即仰胆，饮食亦尝胆也。曰：「女忘会稽之耻邪？」","translation":"吴国赦免越国后，越王勾践回国，劳苦身体、焦虑思考，把苦胆挂在座位上，坐着躺着都仰头看胆，吃饭时也尝胆，说：你忘了会稽之耻吗？","figures":["勾践","范蠡","文种","夫差"],"decision":"战败后不急于反攻，以十年生聚、十年教训的方式修复国力并持续自我提醒","outcome":"越国由亡国边缘恢复为强国，最终灭吴，勾践成为春秋最后一位霸主","themes":["临危受命","学习成长","宽政","待时而动","蓄力","忍辱负重","卧薪尝胆","休养生息","积聚","东山再起"],"pros":["把复仇写成每日仪式，长期蛰伏中人不松懈，方向感不靠情绪维持。","用十年生聚十年教训养国力，期间对吴示弱，买到了不再挨打的时间。","不急于一战，等的是吴国内部出错，把复仇变成一件等得起的事。"],"cons":["二十年是极长的账期，中途只要病死或吴国先动手，蛰伏就成了慢性失血。","苦身焦思压着所有人陪着熬，长期紧绷本身在消耗越国的元气。","这套办法只能对着一个明确的仇人用，仇人一去，全国的方向感就会落空。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"汉书·高帝纪","title":"刘邦封雍齿","original":"留侯曰：「上平生所憎，群臣所共知，谁最甚者？」上曰：「雍齿与我故，数尝窘辱我。」留侯曰：「今急先封雍齿以示群臣，群臣见雍齿封，则人人自坚矣。」于是上乃置酒，封雍齿为什方侯。","translation":"张良问：陛下平生最恨、群臣都知道的是谁？刘邦说：雍齿与我有旧怨，多次羞辱我。张良说：现在赶紧先封雍齿给群臣看，群臣见雍齿都被封，就人人安心了。于是刘邦设宴，封雍齿为什方侯。","figures":["刘邦","张良","雍齿"],"decision":"把最不受自己待见的人率先列入分配名单，用一次公开分配重建分配公平的可信度","outcome":"群臣不再担心被清算和遗漏，内部军心安定，避免了功臣集团的集体不安","themes":["民心","激励士气","猜忌","管理失控","封赏无度","尾大不掉","收揽人心","厚赏","分封","上下离心"],"pros":["用一个最不该封的人做样本，比发十道安民告示更能让人相信名单公平。","雍齿都封了，有旧怨的人立刻推出自己必不被清算，观望情绪当场止住。","成本只是一块封地，换来的是整个功臣集团不在这时候闹事。"],"cons":["先封仇人是特例，往后按功次排队时，被跳过的将领会拿这次当先例。","治的是怕被清算这一层不安，封赏总额没减，尾大不掉的隐患原样留着。","靠一次酒宴上的姿态稳住人心，下次分配不均时，同样的不安会加倍回来。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"宋史·王安石传","title":"熙宁变法","original":"安石曰：「天变不足畏，祖宗不足法，人言不足恤。」","translation":"王安石说：天象变化不必畏惧，祖宗成法不必效法，众人议论不必顾虑。","figures":["王安石","宋神宗","司马光","苏轼"],"decision":"以「三不足」的强势姿态自上而下推行青苗、募役等新法，压缩反对派的表达空间","outcome":"新法在党争中反复起废，执行层层走样，北宋财政与政治生态持续恶化","themes":["内部矛盾","拒谏","识人","转型","改弦更张","变计","刚愎自用","不用其言","内部分裂"],"pros":["先一句话否掉天变祖制人言三道依据，改革初期推得动、下不了车。","青苗募役直指财政与差役积弊，短期确实把钱粮从旧渠道里挤了出来。","强硬姿态压住冗长争议，省下与每一方反复议价的行政时间。"],"cons":["把反对意见一律打成阻力，神宗身边再没人能提前预警执行走样。","新法要靠层层官吏去办，只问是否照办的考核逼出的是加码摊派。","改革全靠王安石一人在位顶住，他一退，新法就成党争筹码被反复起废。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"明史·张居正传","title":"考成法与一条鞭法","original":"居正为政，以尊主权、课吏职、信赏罚、一号令为主。虽万里外，朝下而夕奉行。","translation":"张居正执政，以尊崇皇权、考核官吏、严明赏罚、统一号令为要点。即使万里之外，早上下达的命令晚上就被执行。","figures":["张居正","明神宗","冯保"],"decision":"用考成法把政务拆成可核对的期限与责任，再以一条鞭法简化税制，先立规则后推执行","outcome":"十年间国库充盈、边防稳固，但张居正身后被清算，改革成果大半被废","themes":["定制度","将不受命","激励士气","管理失控","明法度","申军法","赏罚分明","尾大不掉"],"pros":["把政务拆成期限与责任人，万里之外也当天执行，政令第一次压到基层。","一条鞭把繁杂税目并成一项，征收核算的口子少了，中间揩油的空间随之收窄。","先立规则后推执行，赏罚有据，肯办事的官吏有明确的上升路径。"],"cons":["全部效力系于张居正与冯保的支撑，皇帝要收回权威时无人能接着护住制度。","严核期限会逼出只求按期交差的做法，报上来的数字未必是实情。","得罪的是一整代被考成的官僚与其背后势力，主政者一倒，反扑来得极快。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"明史·袁崇焕传","title":"己巳之变与反间","original":"会我大清设间，谓崇焕密有成约，令所获宦官知之，阴纵使去。其人奔告于帝，帝信之。","translation":"恰逢清方设下反间之计，声称袁崇焕与清军有密约，故意让俘获的宦官知道，再暗中放他回去。这名宦官逃回后报告皇帝，皇帝相信了。","figures":["袁崇焕","崇祯帝","皇太极"],"decision":"崇祯在敌方制造的单一来源情报基础上，未经直接核验即将前线最高指挥官下狱","outcome":"袁崇焕被凌迟处死，辽东防线失去核心统帅，明末边防加速崩塌","themes":["功高震主","拒谏","猜忌","识人","谗言构陷","反间","离间","谗言","构陷","误信","自毁长城"],"pros":["京师被围、情报混乱之际迅速抓人，立刻向朝野表明无人可越过程序之外。","若密约属实，此举能在清军兵临城下时掐断内应，属于代价可控的止损。","以雷霆手段震慑摇摆的守将，短期内没人敢与城外私下接触。"],"cons":["只凭敌方放回的一名宦官口供就下狱主帅，等于让敌方替我方决定人事。","临阵换帅，辽东前线立刻失去能统住全局的人，防线此后加速瓦解。","这次定罪让边将明白打得好也可能随时被疑，援兵此后不敢尽全力、不敢久留。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·孙子吴起列传","title":"孙膑围魏救赵","original":"善战者，因其势而利导之。……今梁赵相攻，轻兵锐卒必竭于外，老弱罢于内。君不若引兵疾走大梁，据其街路，冲其方虚，彼必释赵而自救。","translation":"善于作战的人，能顺应形势而加以引导。……如今魏赵相攻，魏国精锐必然全出在外，国内只剩老弱疲敝。您不如率兵急趋大梁，占据要道，冲击其空虚之处，魏军必然放弃攻赵而回救。","figures":["孙膑","田忌","庞涓"],"decision":"不与强敌正面比拼总量，而是攻击其必救的薄弱点，把对手的节奏变成自己的节奏","outcome":"魏军回撤途中在桂陵被伏击大败，赵国得救，齐国确立东方强国地位","themes":["敌强我弱","避实击虚","以弱胜强","后发制人","众寡不敌","形势不利"],"pros":["不硬碰魏军锋锐，而打它必须回救的地方，主动权一下转到我方手里。","赵国围解，齐国不必真与魏军主力决战就拿到救赵的名分与实利。","把魏军的行军路线变成自己的预设战场，桂陵一战是以逸待劳。"],"cons":["全押在魏军会按常理回救上，若庞涓先破赵再回头，大梁就必须真打。","直趋大梁要穿魏国腹地，后勤与退路都薄，被识破就有两头受夹的危险。","判断的依据是魏国内部空虚这一条情报，对方留守做得好，这一手就落空。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·廉颇蔺相如列传","title":"将相和","original":"相如曰：「夫以秦王之威，而相如廷叱之，辱其群臣。相如虽驽，独畏廉将军哉？顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。今两虎共斗，其势不俱生。」","translation":"蔺相如说：以秦王的威势，我尚且当廷呵斥他、羞辱他的群臣。我虽然无能，难道会怕廉将军吗？只是我想，强大的秦国之所以不敢对赵国用兵，正是因为有我们两人在。如今两虎相斗，势必不能共存。","figures":["蔺相如","廉颇","赵王"],"decision":"在内部排位之争中选择回避退让，把「对外共同威胁」置于个人面子之上，并明确说出理由","outcome":"廉颇负荆请罪，二人结为刎颈之交，赵国在强秦压力下维持数十年稳定","themes":["内部矛盾","猜忌","将帅不和","内部分裂","同室操戈","上下离心","内部倾轧","团队矛盾"],"pros":["把对外的共同威胁摆到个人名次前面，两人一让，秦国多年不敢对赵用兵。","主动回避并把理由说清，免得廉颇在误解里继续加码，冲突没滑到不可收拾。","让出去的是朝堂排位，换回来的是赵国最需要的将相同心，账是划算的。"],"cons":["单方面退让的效力取决于对方肯收手，廉颇始终不悟，退让就被当成软弱。","把两人在朝说成秦国不敢加兵的全部原因，等于把国运押在这一层关系上。","矛盾只是被压住没有解决，换成别的重臣时，同样的排位摩擦还会再来。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"汉书·贾谊传","title":"陈政事疏：众建诸侯而少其力","original":"欲天下之治安，莫若众建诸侯而少其力。力少则易使以义，国小则亡邪心。","translation":"要想天下安定，不如多封诸侯而削弱各自的力量。力量小就容易用道义驱使，封国小就不会有邪念。","figures":["贾谊","汉文帝","晁错"],"decision":"用拆分增量、稀释单一节点权重的方式处理已经做大的地方势力，而非直接对抗","outcome":"为后来推恩令提供思路，汉廷逐步解决诸侯尾大不掉问题，避免立即爆发内战","themes":["定制度","管理失控","转型","尾大不掉","分封","诸侯并起","改弦更张","组织膨胀"],"pros":["不动刀兵只改分封规格，用规则把大诸侯拆小，避开了中央与地方正面开战。","一家分成几家，诸侯越多每家的力量越小，反抗的能量被切碎在内部。","给文帝留出慢慢推进的余地，不必在自己任内向所有诸侯同时摊牌。"],"cons":["拆封要诸侯自己配合，实际推进依赖对方顺从，不配合时手里没有硬办法。","见效极慢，等不起的后来者往往改成直接削藩，反而把内战提前引爆。","减小了每家的实力，却没解决诸侯与中央之间的名分，根还留在原处。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"明史·王守仁传","title":"龙场悟道与南赣平乱","original":"守仁因俗化导，夷人喜，相率伐木为室，以栖守仁。（后）行十家牌法，盗贼稍息。","translation":"王守仁依当地风俗开导教化，当地人很高兴，纷纷砍木建屋让他居住。后来推行十家牌法，盗贼逐渐平息。","figures":["王守仁","南赣民众"],"decision":"在资源与兵力都不足的地方，先以低成本制度（十家牌法）重建基层秩序，而不是单纯增兵","outcome":"南赣多年积乱被平定，王守仁以极小的行政成本恢复了控制","themes":["定制度","宽政","民心","资源不足","立约","立规","收揽人心","兵少","势单力薄"],"pros":["先按当地风俗待人，换来本地人主动出力，等于不花钱就拿下人心这一层。","十家牌法靠邻里互保把秩序交回基层，用极少的官兵管住了一大片地方。","治安成本压到最小，省下的钱粮与时间可以拿去做教化与善后。"],"cons":["十家牌法靠邻里连坐，一旦有冤情或滥用，民众的抵触会直接瓦解这套办法。","它压下的是明面上的盗贼，山区流动人口与更深的经济问题还在原处。","效果取决于主政者肯不肯常驻细办，人一走，牌法很快变成一纸空文。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"旧唐书·魏征传","title":"以人为镜","original":"太宗谓侍臣曰：「夫以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。朕常保此三镜，以防己过。」","translation":"唐太宗对身边大臣说：用铜作镜子，可以端正衣冠；用历史作镜子，可以知道兴衰更替；用人作镜子，可以明白得失。我常保有这三面镜子，以防自己犯错。","figures":["唐太宗","魏征"],"decision":"制度化地保留一个专门提出反对意见的角色，并把批评视为资产而非威胁","outcome":"贞观年间谏议成风，决策失误率显著下降，形成后世称道的治世","themes":["拒谏","招才","用人","不听谏","举贤","任用贤能","纳士","亲贤臣"],"pros":["身边留一个专说反话的人，很多错在动手之前被点出来，纠错成本最低。","把批评说成资产，魏征这类人才肯把话说完，不必先算自己的安危。","把历史和人都当镜子用，判断有参照系，不靠一时一地的感觉。"],"cons":["这套做法完全依赖君主肯听，换一个不愿听的皇帝，镜子立刻成了摆设。","专设谏臣会招来揣摩上意的取巧者，敢说话和说真话不是一回事。","把纠错寄托在少数敢言的人身上，人一旦不在位，剩下的多是顺意的声音。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"贞观政要·论政体","title":"水能载舟，亦能覆舟","original":"君，舟也；人，水也。水能载舟，亦能覆舟。","translation":"君主是船，百姓是水。水能承载船，也能掀翻船。","figures":["唐太宗","魏征"],"decision":"把「用户随时可以离开」当作最高级别的风险，主动把这条铁律写进日常议政","outcome":"君臣长期以此为戒，轻徭薄赋、纳谏成风，形成后世称道的贞观之治","themes":["宽政","民心","得民心","收揽人心","与民休息","轻徭薄赋","失民心"],"pros":["把百姓可以推翻自己当成日常前提，赋役与用兵的尺度会本能地收着。","这个比喻君臣都听得懂，议政时有条共同底线，不至于一味加码。","承认自己随时可被替换，反而让轻徭薄赋这类决定容易通过。"],"cons":["这是一句警醒不是条目，具体政策是否伤民仍要逐件去判，口号拦不住。","长期挂在嘴上容易变成仪式，说得越熟，遇事越可能只当套话念过。","只教人堤防水会翻船，没给出怎样估出民力承受上限的办法。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"新序·杂事","title":"皮之不存，毛将焉附","original":"皮之不存，毛将焉附？","translation":"皮都不存在了，毛还能附着在哪里呢？","figures":["魏文侯","李克"],"decision":"在赖以生存的根本（信誉与基本盘）动摇时，不再纠缠枝节利益，先保住根本","outcome":"被后世反复引用为「先保住根本，再谈其余」的判断准则","themes":["务实","口碑","基本盘","宽政","恢复元气","民心","根本","失民心","轻徭薄赋"],"pros":["根本动摇时果断放下枝节利益，先保住还能站住的那部分，止损最快。","抓住根本的判断让取舍有依据，不必每件事都反复权衡。","保住了基本盘，此前的争议与亏欠都还有机会再谈，反过来则不成立。"],"cons":["要认准哪一层是皮得有眼力，认错了就是拿命脉去换无关紧要的东西。","讲根本容易变成推迟处理具体问题的借口，枝节烂久了也会烂到根本。","这套算法只教保什么，没说保不住时怎么办，退无可退时它就不管用了。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"史记·李斯列传","title":"沙丘之变","original":"丞相斯为上崩在外，恐诸公子及天下有变，乃秘之，不发丧。……高乃与公子胡亥、丞相斯阴谋破去始皇所封书赐公子扶苏者，而更诈为丞相斯受始皇遗诏沙丘，立子胡亥为太子。","translation":"丞相李斯因皇帝死在外面，怕诸公子和天下生变，就秘不发丧。……赵高便与公子胡亥、丞相李斯合谋毁掉始皇赐给扶苏的诏书，另伪造李斯在沙丘受遗诏，立胡亥为太子。","figures":["李斯","赵高","胡亥","扶苏","蒙恬"],"decision":"李斯为保住个人权位，与赵高结盟伪造继承安排，放弃原本可以坚持的程序正义","outcome":"扶苏、蒙恬被杀，秦二世而亡，李斯本人最终被赵高腰斩于咸阳","themes":["内部矛盾","拒谏","派系斗争","猜忌","谗言构陷","同室操戈","内部倾轧","构陷","谗言","夺嫡","骨肉相残"],"pros":["秘不发丧把继承真空期压到最短，咸阳若按计划走，短期确实能避免天下有变。","与赵高、胡亥绑在一起，李斯保住了相位与新政的延续，个人权位当时没动摇。","伪造一份遗诏就能改掉结果，成本远低于公开争位，事情办得干净。"],"cons":["立胡亥的把柄从此握在赵高手里，李斯保住的是位置，交出的是对局势的掌控。","程序被破一次就再也立不起来，此后谁有兵有势都能照着改诏书。","扶苏蒙恬一死，秦朝自断最硬的一根柱子，二世而亡，李斯也死在赵高手上。"],"verdict":"","verdictWhy":""},{"book":"种子","chapter":"战国策·燕策","title":"千金买骨与黄金台","original":"郭隗曰：「臣闻古之君人，有以千金求千里马者，三年不能得。……死马且买之五百金，况生者乎？天下必以王为能市马，马今至矣。」于是昭王为隗筑宫而师之。","translation":"郭隗说：我听说古代有位君主用千金求千里马，三年没得到。……死马尚且用五百金买下，何况活马？天下人必定认为大王真心买马，好马就要来了。于是燕昭王为郭隗筑宫并以师礼相待。","figures":["燕昭王","郭隗","乐毅","剧辛"],"decision":"先高价对待一个并非顶尖的人才，用可观察的定价信号向市场传递求贤的诚意","outcome":"乐毅、剧辛等人才相继来投，燕国由破败之国转为强国并几乎灭齐","themes":["招才","民心","激励士气","招贤","纳士","举贤","厚赏","激赏","收揽人心","不拘一格"],"pros":["花五百金买下死马骨，用一次高价交易让天下人看见求贤的诚意，信号传得又快又远。","先厚待郭隗这种并非顶尖的人，等于给各层次人才报出一个可信的价格。","筑宫以师礼相待，把贤者能被当老师摆在明处，来投的人有明确预期。"],"cons":["先厚待郭隗会造成定价基准，后来的真才待遇若低于他，落差立刻变成怨气。","溢价买信号只在燕国确实需要且付得起时成立，财政撑不住就成了空头承诺。","招来的人能不能用，要看他有没有对应的位置与信任，否则只是把名声做大。"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·五帝本纪","title":"尧舜禅让：以贤不以亲","original":"尧知子丹朱之不肖，不足授天下，于是乃权授舜。授舜，则天下得其利而丹朱病；授丹朱，则天下病而丹朱得其利。尧曰「终不以天下之病而利一人」，而卒授舜以天下。","translation":"尧知道儿子丹朱不成器，不足以把天下交给他，于是把权位授给舜。授给舜，天下得利而丹朱受损；授给丹朱，天下受损而丹朱得利。尧说「终究不能以天下的损害来让一个人得利」，最终把天下交给了舜。","figures":["尧","舜","丹朱"],"decision":"在接班人选上放弃血缘优先，用「天下受损还是个人受损」作为判断标准，把位置交给能承担的人","outcome":"政权平稳过渡，舜继位后天下大治，成为后世推举制的样板","themes":["决断","定制度","招才","接班","民心","用人","举贤","公心","制度约束","收揽人心"],"pros":["把「天下受损还是个人受损」当尺子，选出的接班人靠得住，政权交接没有生乱","主动放弃传子的私利，丹朱一系不至于因德不配位而被推翻","立下贤者上位的先例，舜之后天下大治，后来者难以拿血统翻案"],"cons":["成败全系于尧一个人的眼光，看错人就是害天下也害自家","丹朱一脉的利益被牺牲，开了血缘继承的缺口，后世仍会有人翻这笔账","没有可复制的选贤程序，换一个君主就办不成"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·夏本纪","title":"大禹治水：改堵为疏","original":"禹乃行相地宜所有以贡，及山川之便利。……禹伤先人父鲧功之不成受诛，乃劳身焦思，居外十三年，过家门不敢入。","translation":"禹于是巡行察看土地适宜的出产以定贡赋，以及山川的便利。……禹痛心父亲鲧治水不成而被诛，于是劳苦身体、焦虑思虑，在外十三年，经过家门也不敢进去。","figures":["禹","鲧","舜"],"decision":"放弃父亲「筑堤硬堵」的老办法，改为勘察地形、疏导水流的路线，并用十三年持续投入","outcome":"水患平定，禹因此获得众望并建立夏朝，治水成为古代最著名的工程管理案例","themes":["民心","蓄力","资源不足","转型","长期主义","战略转型","改弦更张","持久战","忍辱负重","收揽人心"],"pros":["先勘察地形再定方案，避开了父亲硬堵、越堵越坏的循环","十三年不换方向，河道疏通后水患根除，投入没有被反复推翻浪费","治水的声望把禹推到政治顶点，夏朝由此建立"],"cons":["十三年在外不能回家，人力物力靠禹本人近乎自虐地硬撑","只有愿意长期在外、甘于吃苦的人扛得住，换个人早就半途而废","父亲鲧治水不成被诛在前，这条路线哪怕正确也容不得一次失败"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·周本纪","title":"武王伐纣：时机与盟约","original":"诸侯不期而会盟津者八百诸侯。诸侯皆曰：「纣可伐矣。」武王曰：「女未知天命，未可也。」乃还师。居二年，闻纣昏乱暴虐滋甚……乃遵文王，遂率戎车三百乘，虎贲三千人，甲士四万五千人，以东伐纣。","translation":"诸侯不约而同到盟津会合的有八百诸侯。诸侯都说：可以讨伐纣了。武王说：你们还不懂天命，还不行。于是退兵。过了两年，听说纣更加昏乱暴虐……于是遵循文王的路线，率战车三百乘、勇士三千人、甲士四万五千人，东进伐纣。","figures":["周武王","姜子牙","商纣王"],"decision":"在盟军已聚、众人催促时判断时机未到而主动退兵，等对方内部崩坏后再集中出手","outcome":"牧野一战商军倒戈，商朝灭亡，周朝建立","themes":["待时而动","联盟","误判","轻敌","避实击虚","误判形势","以弱胜强","会盟","盟约"],"pros":["八百诸侯到齐仍按兵不动，避免在商朝气数未尽时打消耗战","两年后商朝内部崩坏，牧野一战商军倒戈，代价极小","退兵一次让诸侯看清不是被人催着走，联盟主导权握在自己手里"],"cons":["八百诸侯白跑一趟，士气与信任被消耗，下次能不能再聚齐是未知数","纣若没有继续昏乱下去，等待就变成拖延，联盟会自行散掉","长期按兵不动，给了商朝逐个收拾盟友的时间"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·周本纪","title":"国人暴动与共和行政","original":"王行暴虐侈傲，国人谤王。召公谏曰：「民不堪命矣。」王怒，得卫巫，使监谤者，以告则杀之。其谤鲜矣，诸侯不朝。……三年，乃相与畔，袭厉王。","translation":"周厉王行事暴虐奢侈傲慢，国都的人指责他。召公劝谏说：百姓受不了了。厉王大怒，找来卫国的巫师，让他监视指责者，一被告发就杀掉。指责的声音少了，但诸侯不来朝见。……三年后，人们一起反叛，袭击厉王。","figures":["周厉王","召公","卫巫"],"decision":"用压制言论代替解决问题，把「听不到抱怨」误当成「问题已解决」","outcome":"厉王出逃，出现共和行政，周王室权威大幅衰落","themes":["内部矛盾","口碑","拒谏","民心","苛政","暴政","民怨","失民心","口碑崩塌","内部倾轧"],"pros":["卫巫监视之下，公开的指责确实少了，厉王耳根清净了三年","不动既得利益的格局，王室的用度与行事方式照旧不受约束"],"cons":["抱怨消失不等于问题消失，诸侯从此不来朝见，外部支持先断了","除了抓人杀人没有别的处置手段，压住的怨气最后一起爆发成暴动","连召公的劝谏也听不进去，身边再没有人能提前报警"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·齐太公世家","title":"齐桓公不计射钩之仇","original":"鲍叔牙曰：「君若欲霸王，非管夷吾不可。」……桓公曰：「管仲射寡人中钩，是以滨于死。」鲍叔牙曰：「彼为其君动也，君若宥而反之，其为君亦犹是也。」","translation":"鲍叔牙说：您若想成就霸业，非管仲不可。……桓公说：管仲曾射中我的衣带钩，我差点死掉。鲍叔牙说：他是为他的君主效力，您若赦免并召回他，他也会同样为您效力。","figures":["齐桓公","管仲","鲍叔牙"],"decision":"把「曾经对抗过我」重新解释为「忠于职守」，从而敢用一个曾想杀自己的人担任最高执行者","outcome":"管仲改革内政、九合诸侯，齐桓公成为春秋首霸","themes":["招才","用人","联盟","识人","举贤","不拘一格","招贤"],"pros":["把管仲射钩解释成忠于其主，等于告诉所有人旧怨可以不算","用的是敌营里已被验证过的人，比从零培养可靠得多","容下政敌并授以国政，鲍叔牙一派也因此更服气"],"cons":["敢用仇人须有绝对掌控力，少了鲍叔牙这道缓冲，风险就落回自己身上","把最高执行权交给外人，等于承认自己打仗行、治国不行","这种赦免只有霸主级别的底气撑得住，底气不足的人照做只是纵容叛徒"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·管晏列传","title":"仓廪实而知礼节","original":"仓廪实而知礼节，衣食足而知荣辱。……故曰：「知与之为取，政之宝也。」","translation":"粮仓充实了人才懂得礼节，衣食充足了人才知道荣辱。……所以说：懂得「给予就是获取」，这是治理的法宝。","figures":["管仲","齐桓公"],"decision":"先解决基本生存与收入问题，再谈规范与文化建设，把资源分配顺序当成管理前提","outcome":"齐国国力迅速充实，成为春秋前期最强国家","themes":["定制度","宽政","恢复元气","民心","激励士气","厚赏","减负纾困"],"pros":["先让百姓吃饱再谈礼节荣辱，规范才有人肯遵守","把让利算成投资，国力与民心同时充实，成为春秋前期最强","顺序清楚：生存问题不解决，后面的制度都是空话"],"cons":["整套主张的前提是有足够产出可分，仓廪长期不实就启动不了","先厚给再取，短期财政压力大，遇上灾荒或战事两头落空","把礼义认同压在收入水平上，经济一下滑，先前建立的共识会一起垮"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·晋世家","title":"假途灭虢：借道与反噬","original":"荀息曰：「请以屈产之乘与垂棘之璧，假道于虞以伐虢。」……宫之奇谏曰：「虢，虞之表也；虢亡，虞必从之。谚所谓『辅车相依，唇亡齿寒』者，其虞、虢之谓也。」虞公不听。","translation":"荀息说：请用屈地良马与垂棘美玉，向虞国借道去攻虢国。……宫之奇劝谏说：虢是虞的外围，虢亡了虞必然跟着亡。谚语说的「辅车相依，唇亡齿寒」，讲的就是虞和虢。虞公不听。","figures":["晋献公","荀息","虞公","宫之奇","虢"],"decision":"虞公为眼前财物出借战略通道，忽视自己与虢国的依存关系","outcome":"晋灭虢后回师顺手灭虞，虞公被俘，唇亡齿寒成为千年教训","themes":["联盟","被孤立","识人","误判","资源不足","转型","误判形势","战略转型","识人不明"],"pros":["当场收下屈产良马与垂棘之璧，虞公眼前拿到实利","借道给晋不得罪当时最强的国家，短期换来一边的安宁"],"cons":["借出的战略通道没有附加任何条件，也没换回对等的安全保证","只算玉与马这笔账，没算自己与虢国唇齿相依那笔根本账","虢国一亡虞国就失去外围，晋军回师可顺手灭虞，贪小利反把自己送死"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·秦本纪","title":"秦穆公五羊皮换贤","original":"缪公闻百里傒贤，欲重赎之，恐楚人不与，乃使人谓楚曰：「吾媵臣百里傒在焉，请以五羖羊皮赎之。」楚人遂许与之。……缪公大说，授之国政，号曰五羖大夫。","translation":"秦穆公听说百里傒贤能，想重金赎回，又怕楚人不给，就派人对楚人说：我的陪嫁臣仆百里傒在你们那里，请用五张黑羊皮赎他。楚人便答应了。……穆公大喜，把国政交给他，号称五羖大夫。","figures":["秦穆公","百里傒","蹇叔"],"decision":"用低价隐蔽真实意图完成人才获取，到手后立刻交付实权而非试用观望","outcome":"百里傒、蹇叔辅政，秦国由边陲弱国转为西方强国","themes":["招才","用人","识人","招贤","纳士","举贤","不拘一格"],"pros":["故意报低价隐藏真实意图，楚国没察觉放走的是国宝","人到手立刻交国政，不设试用观望期，百里傒与蹇叔肯把本事全拿出来","五张羊皮换来的回报极不成比例，秦国由边陲弱国变为西方强国"],"cons":["靠贬低对方身份做成交易，楚国一旦识破，赎回就会变成勒索","不试用直接给实权，只有秦穆公这样敢放权的人压得住，看错人无从撤回"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·商君列传","title":"商鞅徙木立信","original":"令既具，未布，恐民之不信，已乃立三丈之木于国都市南门，募民有能徙置北门者予十金。民怪之，莫敢徙。复曰「能徙者予五十金」。有一人徙之，辄予五十金，以明不欺。卒下令。","translation":"法令已备好但未公布，怕百姓不信，于是在国都市场南门立三丈之木，招募能搬到北门的人赏十金。百姓觉得奇怪，没人敢搬。又说「能搬的赏五十金」。有一人搬了，立刻给五十金，表明不欺骗。最终下达法令。","figures":["商鞅","秦孝公"],"decision":"在推行重大制度变更前，先做一次小额但公开、即时、足额兑现的承诺测试，建立执行力信用","outcome":"法令顺利推行，秦国迅速强盛，为统一奠定基础","themes":["定制度","激励士气","明法度","赏罚分明","立规","约法","制度约束"],"pros":["用一次看得见、当场足额兑现的小事立住官府说话算数","成本只是五十金，换来的是变法最要紧的执行力信用","先测民心再下法令，新法不会被当成一纸空文"],"cons":["信用要靠一次次不打折的兑现维持，此后任何一次缩水都前功尽弃","这套办法对付的是不信官府，前提是随时拿得出钱来兑现","五十金只证明赏会兑现，证明不了罚会公正，民众的顺从仍靠震慑维持"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·商君列传","title":"商鞅车裂：改革者的结局","original":"公子虔之徒告商君欲反，发吏捕商君。……商君既复入秦，走商邑，与其徒属发邑兵北出击郑。秦发兵攻商君，杀之于郑黾池。秦惠王车裂商君以徇，曰：「莫如商鞅反者！」","translation":"公子虔一伙告发商鞅想谋反，派官吏抓捕。……商鞅回到秦国，逃到商邑，与部属发邑兵北上攻打郑国。秦国发兵攻商鞅，在郑黾池杀了他。秦惠王把商鞅车裂示众，说：不要像商鞅那样谋反！","figures":["商鞅","秦孝公","秦惠王","公子虔"],"decision":"改革全程依赖君主个人授权，得罪了几乎所有旧势力，却未留下任何可延续的政治同盟","outcome":"孝公一死，商鞅被车裂，但新法未被废除——制度留下了，人没有","themes":["内部矛盾","口碑","改革受阻","猜忌","被孤立","内部倾轧","改革推不动","得罪人","上下离心","同室操戈"],"pros":["凡事只依赖孝公一人授权，改革推进时不被朝中各方牵制，速度极快","敢对旧势力下重手，新法因此没有中途打折","新法本身被留下来继续使用，说明改革内容是立得住的"],"cons":["授权来源押在君主一人身上，孝公一死就失去唯一的保护","几乎得罪了每一个旧势力，却没有留下一个关键时刻能说话的政治同盟","变法的强制手段在君主更替后失去靠山，反而成了处置他的理由"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·苏秦列传","title":"苏秦合纵：把敌人变成共同点","original":"苏秦说六国从合而并力焉。苏秦为从约长，并相六国。……「臣闻用兵而喜先天下者忧，约结而喜主怨者孤。」","translation":"苏秦劝说六国合纵并力。苏秦任纵约长，兼任六国相。……「我听说用兵而喜欢抢先于天下的会有忧患，结盟而喜欢承担怨恨的会陷于孤立。」","figures":["苏秦","赵肃侯","燕文侯","秦惠王"],"decision":"把六个彼此有旧怨的国家用「共同威胁」重新组织，并让自己成为不可替代的连接点","outcome":"秦国十五年不敢出函谷关，但联盟随苏秦失势而崩解","themes":["敌强我弱","管理失控","联盟","被孤立","避实击虚","盟约","以弱胜强","组织膨胀"],"pros":["把彼此有旧怨的六国用共同威胁重新组织起来，秦国十五年不敢出函谷关","让自己成为联盟唯一不可替代的连接点，六国相印集于一身","联盟在时，弱国不必单独面对强秦"],"cons":["联盟靠共同威胁维系，威胁看起来一减弱，各国就开始各自打算盘","六国旧怨并未化解，苏秦一失势，联盟立刻崩解","连接点只有他一个人，他的处境直接等于联盟的存亡"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·张仪列传","title":"张仪连横：用承诺拆解联盟","original":"张仪曰：「大王诚能听臣，闭关绝约于齐，臣请献商於之地六百里。」楚怀王说而许之。……张仪至秦，详失绥堕车，不朝三月。楚王闻之，曰：「仪以寡人绝齐未甚邪？」乃使勇士至宋，借宋之符，北骂齐王。","translation":"张仪说：大王若真能听我，与齐国断交，我请求献出商於之地六百里。楚怀王高兴地答应。……张仪回秦后假装失手坠车，三个月不上朝。楚王听说后说：张仪是觉得我与齐国断得不够彻底吗？于是派勇士到宋国，借宋国符节北上辱骂齐王。","figures":["张仪","楚怀王","秦惠王","齐王"],"decision":"用一个无法即时验证的大额承诺，换取对手先做出不可逆的自我伤害动作","outcome":"楚齐联盟破裂，张仪只给六里地，楚国此后屡败于秦","themes":["被孤立","识人","谈判","谗言构陷","轻敌","反间","离间","误信"],"pros":["用一张无法即时验证的地契，换对手先做出对齐国断交这种不可逆动作","躲了三个月不露面，让对方自己加码，成本几乎为零","楚齐联盟一破，楚国在秦国面前再无外援"],"cons":["承诺越大越无法验证，全靠对方肯信；对方若坚持先交割，戏就演不下去","同一个骗局只能用一次，此后秦国的任何承诺都会被当成新的骗局","把楚国逼到绝境并屡次击败，短期收益换来一个长期的死敌"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·廉颇蔺相如列传","title":"完璧归赵：以决绝换谈判空间","original":"相如持其璧睨柱，欲以击柱。秦王恐其破璧，乃辞谢固请。……相如度秦王虽斋，决负约不偿城，乃使其从者衣褐，怀其璧，从径道亡，归璧于赵。","translation":"蔺相如拿着璧斜看柱子，要撞上去。秦王怕他砸坏璧，便道歉并坚决请求。……蔺相如估计秦王虽然斋戒，必定会违约不给城，于是让随从穿着粗布衣，怀揣璧玉，从小路逃走，把璧送回赵国。","figures":["蔺相如","秦昭王","赵惠文王"],"decision":"在实力绝对劣势的谈判中先展示「宁为玉碎」的决心，同时准备好实际退路","outcome":"蔺相如全身而退、璧归赵国，赵国在强秦面前保住体面","themes":["孤注一掷","待时而动","敌强我弱","谈判","避实击虚","以弱胜强","对赌","风险管理"],"pros":["以撞柱的决心把玉碎变成可信威胁，逼得秦王当场道歉","一边谈判一边安排随从从小路送璧回国，退路先备好，进退都不受制","在绝对劣势下保住赵国的体面，国宝也没有真赔掉"],"cons":["强硬靠的是秦王舍不得那块璧，对方若不在乎，撞给谁看都没用","当场顶撞强国君主，礼数上的冒犯会被记住，日后要付代价","全靠他临场判断秦王必会负约，判断反了就是人与宝一起折在秦国"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·廉颇蔺相如列传","title":"赵括纸上谈兵","original":"蔺相如曰：「括徒能读其父书传，不知合变也。」赵王不听，遂将之。……秦将白起……射杀赵括。赵卒降者数十万人，秦悉坑之。","translation":"蔺相如说：赵括只会读他父亲的书，不懂随机应变。赵王不听，仍任命他为将。……秦将白起……射杀赵括。赵国投降的士卒数十万，秦国全部坑杀。","figures":["赵括","赵孝成王","白起","蔺相如","廉颇"],"decision":"用「理论成绩最好」的人替换「实战结果最好」的人，并忽视其母亲与重臣的一致反对","outcome":"长平之战赵军全军覆没，赵国从此一蹶不振","themes":["拒谏","用人","识人","误判","轻敌","识人不明","误判形势","不听谏"],"pros":["赵括熟读兵书，在赵王面前谈兵条条有理，表达与沟通远胜持重的老将","换掉久拖不决的廉颇，是想摆脱只守不攻的消耗局面"],"cons":["选人的标准是说得清楚而不是打得赢，标准本身就用错了","蔺相如与赵括之母的一致反对被跳过，组织里最后的警报没人听","只有理论没有临阵应变，一换将就把数十万人的性命全押上去"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·田单列传","title":"田单火牛阵：把恐惧变成武器","original":"田单乃收城中得千余牛，为绛缯衣，画以五彩龙文，束兵刃于其角，而灌脂束苇于尾，烧其端。……牛尾热，怒而奔燕军，燕军夜大惊。","translation":"田单收集城中一千多头牛，给它们披上红绸衣，画上五彩龙纹，把兵刃绑在牛角上，把油脂芦苇绑在牛尾上，点燃末端。……牛尾发热，怒而冲向燕军，燕军夜里大惊。","figures":["田单","燕昭王","乐毅","齐襄王"],"decision":"在仅剩两城、资源极度匮乏时，用非对称手段制造对手的心理崩溃点，而非正面拼消耗","outcome":"燕军大败，齐国七十余城全部收复","themes":["资源不足","避实击虚","以弱胜强","势单力薄","奇袭","军需不继"],"pros":["在只剩两城、资源极缺时用现成的牛与城中物资造出奇观，不跟对手拼消耗","夜袭加上龙纹与火，杀伤有限，要的是让对手的心理先崩","燕军一乱，齐国七十余城顺势收复，代价极低"],"cons":["全靠燕军夜里自乱且不辨虚实，天亮或对方稳住阵脚就失效","一次性的奇计不能重来，下一回对手必然有防备","效果依赖城中还凑得出千余头牛与油脂，再困久一点连这些都拿不出"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·刺客列传","title":"荆轲刺秦：准备不足的孤注一掷","original":"太子及宾客知其事者，皆白衣冠以送之。至易水之上……高渐离击筑，荆轲和而歌……「风萧萧兮易水寒，壮士一去兮不复还。」……荆轲逐秦王，秦王环柱而走。","translation":"太子和知道此事的宾客都穿白衣戴白帽送行。到易水边……高渐离击筑，荆轲和着唱歌……「风萧萧兮易水寒，壮士一去兮不复还。」……荆轲追赶秦王，秦王绕柱逃跑。","figures":["荆轲","燕太子丹","秦始皇","樊於期"],"decision":"把全部希望押在一次高风险斩首行动上，且临场因想活捉而错失唯一时机","outcome":"行刺失败，荆轲被杀，燕国加速灭亡","themes":["准备不足","孤注一掷","误判","资源不足","轻敌","误判形势","势单力薄","逼上绝路"],"pros":["燕国已无力正面抗衡，斩首是唯一可能以小成本翻盘的手段","白衣相送的孤注姿态，至少让天下看见燕国不肯屈服"],"cons":[ verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·项羽本纪","title":"巨鹿破釜沉舟","original":"项羽乃悉引兵渡河，皆沉船，破釜甑，烧庐舍，持三日粮，以示士卒必死，无一还心。……楚战士无不一以当十。","translation":"项羽于是率全部军队渡河，凿沉船只，砸破锅甑，烧毁营舍，只带三天口粮，向士卒表示必死决心，没有退还的打算。……楚军战士无不以一当十。","figures":["项羽","宋义","秦将章邯"],"decision":"主动销毁退路，把「可以回头」变成「只能向前」，用极端手段统一团队意志","outcome":"巨鹿之战大破秦军主力，项羽成为诸侯上将军","themes":["内部矛盾","决断","孤注一掷","激励士气","资源不足","避实击虚","以少胜多","团队矛盾","军需不继"],"pros":["主动凿沉船只、砸锅烧舍，把可以回头改成只能向前，临阵只能拼死","只带三天口粮，信号明确，全军的意志被强行统一","巨鹿一战楚军以一当十，打垮秦军主力，项羽由此成为诸侯上将军"],"cons":["全军性命押在一次决战上，战事一不顺就是集体覆没，没有回旋余地","这套办法只在士兵还肯信主将时有效，士气一散就成了自乱","绝境能点火一次，第二次就不灵了，士兵会先替自己想退路"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·项羽本纪","title":"鸿门宴：错失唯一时机","original":"范增数目项王，举所佩玉玦以示之者三，项王默然不应。……樊哙曰：「……如今人方为刀俎，我为鱼肉，何辞为。」","translation":"范增多次向项王使眼色，三次举起佩带的玉玦示意，项王沉默不回应。……樊哙说：……如今人家是刀和砧板，我们是鱼和肉，还告辞什么。","figures":["项羽","范增","刘邦","樊哙","项伯"],"decision":"在可以一举解决最大竞争对手的场合，因顾念情面与自负而反复犹豫，最终放走对方","outcome":"刘邦脱身，四年后垓下反败为胜，项羽自刎乌江","themes":["内部矛盾","决断","轻敌","骨干离职","当断不断","团队矛盾","将帅不和","疏远谋臣"],"pros":["不杀登门谢罪的刘邦，避免在诸侯面前落下杀降的名声","留下一个肯低头的对手，短期内少了几路同时造反的风险"],"cons":["情面与自负压过了范增三次的明确示意，该断的时候没有断","放走的是唯一能跟他争天下的对手，四年后垓下的翻盘由此埋下","主将一犹豫，谋臣的谏言就不再是决定因素，此后这一派的意见更难被采纳"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·高祖本纪","title":"刘邦入咸阳约法三章","original":"与父老约，法三章耳：杀人者死，伤人及盗抵罪。余悉除去秦法。……秦人大喜，争持牛羊酒食献飨军士。沛公又让不受，曰：「仓粟多，非乏，不欲费人。」","translation":"与父老约定，法律只有三条：杀人者处死，伤人及盗窃者抵罪。其余秦法全部废除。……秦地百姓大喜，争相带着牛羊酒食犒劳将士。沛公又推让不接受，说：仓中粮食多，不缺，不想让大家破费。","figures":["刘邦","关中父老","萧何"],"decision":"占领后第一件事是废除苛法并公开承诺，同时拒绝短期摊派以保护长期口碑","outcome":"关中民心归附，成为刘邦稳定的后方与兵源基地","themes":["口碑","定制度","宽政","民心","约法三章","收揽人心"],"pros":["占领后第一件事是废秦苛法、只留三条，条数少到人人记得住","公开承诺又拒收犒劳，名声上先赢一局，关中民心归附","关中后来成为稳定的后方与兵源基地，比一次性的财货值钱得多"],"cons":["三条法只是战时口号，天下安定后必然要恢复完备法律，承诺维持不下去","拒收摊派要靠仓中粮食确实充足，若补给自己都不够，这套姿态撑不住","声望建立在比秦宽这个对比上，一旦自己也要征发，民心会重新算账"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·萧相国世家","title":"萧何收秦图籍","original":"沛公至咸阳，诸将皆争走金帛财物之府分之，何独先入收秦丞相御史律令图书藏之。……汉王所以具知天下厄塞，户口多少，强弱之处，民所疾苦者，以何具得秦图书也。","translation":"沛公到咸阳，诸将都争着跑到金帛财物的府库去分东西，只有萧何先进去收集秦朝丞相御史的律令图书收藏起来。……汉王之所以能详尽了解天下的险要关塞、户口多少、强弱之处、百姓疾苦，就是因为萧何完整得到秦朝的图书。","figures":["萧何","刘邦"],"decision":"在所有人抢分现金资产时，优先拿走「信息与制度资产」","outcome":"刘邦集团掌握全国地理、人口与制度底账，决策效率远超对手","themes":["信息优势","定制度","用人","识人","资源不足","长期主义","后勤","长远布局"],"pros":["别人抢金帛时先拿走律令图书，拿到的是全国地理、人口与制度的底账","靠这些底账，刘邦知道哪里险要、哪里人多、百姓苦什么，判断比对手准","一次动作换来的信息优势，此后一直能用"],"cons":["这条只在马上要治理天下时成立，只想抢一把就走的话图书毫无用处","不分现钱只搬纸，诸将当时争的是眼前好处，这份功劳当场不显眼","图书是死物，要靠重视信息的人持续去用，换个君主就只是堆在库里"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·淮阴侯列传","title":"韩信拜将：登坛之礼","original":"于是王欲召信拜之。何曰：「王素慢无礼，今拜大将如呼小儿耳，此乃信所以去也。王必欲拜之，择良日，斋戒，设坛场，具礼，乃可耳。」王许之。","translation":"于是汉王想召韩信来任命。萧何说：大王一向傲慢无礼，如今任命大将像叫小孩一样，这正是韩信要离开的原因。大王若一定要任命他，要选好日子，斋戒，设坛场，备齐礼仪才行。汉王答应了。","figures":["刘邦","萧何","韩信"],"decision":"把关键人才的任命做成公开、庄重、有成本的仪式，用形式传递重视程度","outcome":"韩信获得足够权威统领诸将，汉军战略能力发生质变","themes":["招才","激励士气","用人","招贤","纳士","厚赏","不拘一格"],"pros":["择良日、斋戒、设坛场，把任命做成有成本的事，形式本身说明这个人重要","刘邦素来傲慢，用一次公开仪式把此人要走的信号补回来","韩信由此获得统领诸将的权威，汉军的战略能力发生质变"],"cons":["仪式只在任命当下起作用，日后的信任仍要靠实绩不断兑现","权威一次给足，若此人另有所图，刘邦手上就没有制衡他的位置","成本高且只能用于极少数人，人人照办就把仪式的分量稀释掉了"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·淮阴侯列传","title":"背水一战","original":"信乃使万人先行，出，背水陈。……军皆殊死战，不可败。……「陷之死地而后生，置之亡地而后存。」","translation":"韩信派一万人先出，背靠河水列阵。……全军都拼死作战，无法被击败。……「陷于死地而后生，置于亡地而后存。」","figures":["韩信","陈余","张耳"],"decision":"在己方是临时拼凑、指挥不熟的情况下，用绝境强制提升执行力，同时另派奇兵夺营","outcome":"井陉之战以少胜多，赵军覆灭，韩信平定河北","themes":["敌强我弱","激励士气","避实击虚","以少胜多","以弱胜强","奇袭"],"pros":["己方是临时拼凑、指挥不熟，背水列阵去掉退路，反而逼出全军的拼死战力","正面死战之外另派奇兵夺营，一路靠士气、一路靠算计","井陉一战以少胜多，赵军覆灭，河北平定"],"cons":["让不熟的部队打必死之战，稍有动摇就先自溃，靠的是算准对方全军压出","能生还的前提是另一路奇兵得手，主副两路缺一路即败","同样的绝境不会让人第二次拼命，这套办法用完就不能再用"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·留侯世家","title":"张良借箸：封雍齿以安众心","original":"留侯曰：「上平生所憎，群臣所共知，谁最甚者？」上曰：「雍齿与我故，数尝窘辱我。」留侯曰：「今急先封雍齿以示群臣，群臣见雍齿封，则人人自坚矣。」","translation":"张良问：陛下平生最恨、群臣都知道的是谁？刘邦说：雍齿与我有旧怨，多次羞辱我。张良说：现在赶紧先封雍齿给群臣看，群臣见雍齿都被封，就人人安心了。","figures":["刘邦","张良","雍齿"],"decision":"把最不受自己待见的人率先列入分配名单，用一次公开分配重建分配公平的可信度","outcome":"功臣集团不再担心被清算，内部迅速安定","themes":["内部矛盾","民心","激励士气","猜忌","管理失控","封赏无度","分封","收揽人心","厚赏","内部倾轧","上下离心"],"pros":["把最不受待见的人先列入名单，用一次公开分配证明分配是公平的","群臣见雍齿都能封，立刻不再担心被清算，内部迅速安定","一个具体动作解决了全体的信心问题，成本极低"],"cons":["要等到危急时才补发，说明分配方案长期不透明，危机过后同样的问题还在","拿君主个人的喜恶去换稳定，此后封赏容易被功臣当成可以反复索取","这招只救得了一次急，若不满的人不止雍齿一个，安抚随即失效"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·吕太后本纪","title":"诸吕之乱","original":"太后称制，议欲立诸吕为王。……王陵曰：「高帝刑白马盟曰『非刘氏而王，天下共击之』。今王吕氏，非约也。」太后不说。","translation":"太后临朝称制，商议想立吕氏诸人为王。……王陵说：高帝杀白马立盟说「不是刘氏而称王的，天下共同讨伐」。如今封吕氏为王，不合约定。太后不高兴。","figures":["吕后","王陵","陈平","周勃","吕禄"],"decision":"吕后以个人权威压倒白纸黑字的盟约，把家族利益置于组织规则之上","outcome":"吕后一死，周勃陈平发动政变诛灭诸吕，刘氏复辟","themes":["内部矛盾","定制度","派系斗争","管理失控","联盟","家族内斗","骨肉相残","制度约束","盟约","组织膨胀","同室操戈"],"pros":["以太后称制的权威压过白马之盟，短时间把家族塞进关键位置","王陵的反对被搁置，朝中一时无人能挡"],"cons":["明文盟约是能被记住的，压得住一时，压不住吕后身后","把家族利益放在组织规则之上，等于告诉所有人规则可以被强者改写","吕后一死，周勃陈平立即政变诛灭诸吕，靠个人权威建的优势没有制度支撑"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·孝文本纪","title":"汉文帝与民休息","original":"上曰：「……夫刑至断支体，刻肌肤，终身不息，何其楚痛而不德也！岂称为民父母之意哉？其除肉刑。」……上曰：「农，天下之本，其开籍田，朕亲率耕，以给宗庙粢盛。」","translation":"皇上说：……刑罚重到砍断肢体、刻伤肌肤，终身不能恢复，多么痛苦而不合德！哪里符合为民父母的本意？废除肉刑。……皇上说：农业是天下根本，要开辟籍田，我亲自带头耕作，用来供给宗庙祭祀的粮食。","figures":["汉文帝","缇萦","贾谊"],"decision":"在国力疲弱时选择降低税负、减轻刑罚、压缩自身开支，把资源留给社会修复","outcome":"文景之治出现，国库充实，为汉武帝时期的扩张提供基础","themes":["宽政","恢复元气","与民休息","休养生息","轻徭薄赋","减负纾困"],"pros":["降税负、废肉刑、压缩自身开支，把资源让给社会自己去恢复","亲耕籍田这种示范不用摊派也能带动农事","换来文景之治与充实的国库，为后来的对外扩张备下本钱"],"cons":["减负的前提是外部暂时没有大敌，边患再起时这套节奏会被打断","国家开支压得太低，遇上天灾与战事，手上可调的资源有限","休养生息积下的财富后来被对外扩张花掉，成果并不能自动留给下一代"],"verdict":"","verdictWhy":""},{"book":"先秦秦汉","chapter":"史记·孝景本纪","title":"吴楚七国之乱","original":"晁错曰：「……今削之亦反，不削亦反。削之，其反亟，祸小；不削之，其反迟，祸大。」……吴王濞……遂发兵反。","translation":"晁错说：……如今削他的地他要反，不削他也要反。削他，反得快，祸患小；不削，反得晚，祸患大。……吴王刘濞……于是发兵反叛。","figures":["汉景帝","晁错","吴王刘濞","周亚夫"],"decision":"判断削藩必反，因而选择主动提前引爆，并接受短期内自己人（晁错）被牺牲的代价","outcome":"三个月平定叛乱，中央集权显著加强，为推恩令铺路","themes":["孤注一掷","将不受命","管理失控","尾大不掉","组织膨胀","分封","主动引爆","诸侯并起"],"pros":["判断削也反、不削也反，于是选在自己准 erdictWhy":""},{"book":"先秦秦汉","chapter":"史记·张耳陈馀列传","title":"刎颈之交到反目：合伙人为何会翻脸","original":"张耳、陈馀始居约时，相然信以死，岂顾问哉。及据国争权，卒相灭亡，何乡者相慕用之诚，后相倍之戾也！","translation":"张耳、陈馀当初贫贱相交时，彼此信任到可以为对方去死，哪里会想到后来？等到各自拿下地盘、争夺权力，终于互相灭亡，为什么当初彼此向慕、以诚相待，后来反目却狠戾到如此地步！","figures":["张耳","陈馀"],"decision":"在各自拥有地盘与部众之后，双方都选择把「谁说了算」放在情谊之上，且以对方的存在作为自己安全的前提","outcome":"两人从刎颈之交到兵戈相向，陈馀战死水上，张耳后来也因失势而被废，双方均无善终","themes":["反目","内部矛盾","猜忌","派系斗争","长期代价"],"pros":["贫贱时以死相许的信任，让两人在最难的阶段互相扶持、共同起家","各自据地后把谁说了算摆在情谊之上，短期内各自的地盘与部众更稳固"],"cons":["双方都把对方的存在当成自己不安全的原因，情谊再深也挡不住这笔算计","上头没有一个能裁决分歧的人，翻脸只是时间问题","结果兵戈相向，陈馀战死，张耳后来失势被废，两个人都没有好下场"],"verdict":"","verdictWhy":""},{"book":"三国两晋","chapter":"三国志·魏书·武帝纪","title":"曹操唯才是举","original":"十五年春，下令曰：「自古受命及中兴之君，曷尝不得贤人君子与之共治天下者乎！……今天下尚未定，此特求贤之急时也。……唯才是举，吾得而用之。」","translation":"建安十五年春，下令说：自古受命与中兴的君主，何曾不是得到贤人君子与他共治天下！……如今天下尚未平定，正是求贤最急的时候。……只要是有才能的就推举，我得到就任用。","figures":["曹操","荀彧","郭嘉"],"decision":"在乱世竞争期把「品行洁癖」让位于「解决问题的能力」，明确宣布只看才能","outcome":"曹魏聚集大量实用人才，成为三国中实力最强者","themes":["招才","用人","识人","举贤","不拘一格","招贤","纳士"],"pros":["天下未定、急缺办事之人时，才能比品行更能换来战场上的胜负","门槛降到只看才能，有本事但有瑕疵的人愿意来投，可选的人比对手多","标准公开明确，被用的人知道自己因何被用，效忠对象不含糊"],"cons":["识才之权全在曹操一人手里，他一旦不在，无人能维持同一套标准","只问能否成事，等于放弃对底线的筛选，队伍内部的摩擦会增多","天下平定后人才不再稀缺，这条标准失去前提，反成负担"],"verdict":"","verdictWhy":""},{"book":"三国两晋","chapter":"三国志·魏书·武帝纪","title":"官渡之战：以弱胜强的后勤战","original":"公曰：「吾知绍之为人，志大而智小，色厉而胆薄，忌克而少威，兵多而分画不明，将骄而政令不一，土地虽广，粮食虽丰，适足以为吾奉也。」……乃燔其粮谷。","translation":"曹操说：我知道袁绍的为人，志向大而才智小，外表严厉而胆量小，忌刻而缺少威信，兵多而部署不明，将领骄横而政令不统一，土地虽广，粮食虽丰，正好是为我准备的。……于是烧了他的粮草。","figures":["曹操","袁绍","许攸","荀彧"],"decision":"在绝对劣势下不与对手拼总量，而是精确打击其最脆弱的后勤节点，并利用对方内部投诚者提供的情报","outcome":"乌巢粮草被焚，袁军崩溃，曹操统一北方","themes":["敌强我弱","谗言构陷","资源不足","避实击虚","以弱胜强","后勤","军需不继","用间"],"pros":["总量拼不过时把力量集中到对手唯一输不起的节点上，能一举翻盘","袁绍营中有许攸这样知道要害又肯投过来的人，要害才买得到","烧粮不歼敌，用最小代价让十万大军自行瓦解"],"cons":["全军押在乌巢一点，若情报有误或袁绍回援及时，曹操本部无处可退","此计靠的是对手继续把粮草集中堆放且疏于守备，袁绍分屯就无从下手","借对方内部分裂成事，这样的机会无法复制，下一次未必还有人肯来投"],"verdict":"","verdictWhy":""},{"book":"三国两晋","chapter":"三国志·魏书·武帝纪","title":"赤壁之败：优势方的误判","original":"公至赤壁，与 为王、公主的全部废为庶人。……杨勇……「儿臣……应当伏剑以谢天下。」","figures":["隋文帝","杨勇","杨广","杨素"],"decision":"因个人好恶与次子的表演式节俭而更换继承人，未做制度化评估","outcome":"杨广继位为隋炀帝，隋朝二世而亡","themes":["内部矛盾","接班","派系斗争","识人","识人不明","误信","家族内斗","夺嫡","骨肉相残"],"pros":["换掉不合你意的继承人，短期内确实消除了你不放心的人继续掌权的可能。","以节俭标准挑继承人，筛掉了你不喜欢的那种生活方式，也让你觉得选的是同类。","废立由你一人拍板，过程最短，不必与杨素之外的人反复扯皮。"],"cons":["只凭好恶和次子刻意演出的节俭做判断，等于放弃了核实他真实品行的机会。","把杨勇连子女一并废为庶人，断了他退让求活的路，他只能以死谢天下。","继承人是最该制度化的那件事，你用人治方式解决它，杨广照此行事，隋朝二世而亡。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"隋书·炀帝纪","title":"大业年间的超负荷工程","original":"始建东都，……每月役丁二百万人。……又……开通济渠，……「男丁不供，始役妇人。」","translation":"开始营建东都，……每月役使民夫二百万人。……又……开凿通济渠，……「男丁不够供应，开始役使妇女。」","figures":["隋炀帝","宇文恺","虞世基"],"decision":"在极短时间内同时推进东都、运河、长城、征辽等多线巨型工程，超出社会承受上限","outcome":"民力枯竭，各地起兵，隋朝三十八年而亡","themes":["多线作战","民心","管理失控","苛政","资源错配","暴政","民怨","组织膨胀","失民心"],"pros":["这些工程若分散在几十年里做，每一件都算得上有利后世的大手笔。","集中调发民力，推进速度确实快，东都、运河都在极短时间内成形。"],"cons":["每月役丁二百万人，同时开几条线，等于把民力一次性透支干净。","男丁不够就役使妇女，说明你已越过社会能承受的那条线却仍不收手。","民力枯竭之后各地起兵便无人可挡，工程本身反而成了压垮王朝的东西。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"隋书·炀帝纪","title":"三征高句丽","original":"……凡一百一十三万三千八百人，号二百万，其馈运者倍之。……「近古出师之盛，未之有也。」……及败，九军并陷，资储器械巨万计，亡失荡尽。","translation":"……共一百一十三万三千八百人，号称二百万，负责运输的是其两倍。……「近古出师之盛况，从未有过。」……战败后九军尽陷，物资器械以巨万计，全部损失。","figures":["隋炀帝","宇文述","来护儿"],"decision":"在对外战事失利后连续追加投入以挽回面子，而不是承认判断错误并止损","outcome":"三次征辽拖垮国力，成为隋末大乱的直接导火索","themes":["止损","沉没成本","误判","资源不足","轻敌","追加投入","误判形势"],"pros":["第一次出师号称二百万，声势为近古之盛，短期内确实让四方不敢轻动。","你追加投入的用意，是不让首次失利变成国威上的缺口，这个考虑本身不算错。"],"cons":["首战九军尽陷、资储荡尽之后，你手里的本钱已经撑不起第二次、第三次。","把撤军等同于认错，于是每次失利都只能靠再打一次来掩盖，沉没成本越滚越大。","三次征辽耗尽国力，反成隋末大乱的直接导火索，面子没保住，天下也丢了。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·高祖纪","title":"李渊晋阳起兵","original":"太宗与晋阳令刘文静首谋，劝举义兵。……「今我来斯，是为汝也。」……乃命……发太原、西河、雁门、马邑……兵。","translation":"李世民与晋阳令刘文静首先谋划，劝父亲起兵。……「如今我来到这里，正是为了你。」……于是命令征发太原、西河、雁门、马邑等地兵员。","figures":["李渊","李世民","刘文静","裴寂"],"decision":"在天下已乱、中央失控时以「尊隋」名义起兵，用合法性外衣降低各方阻力","outcome":"迅速入关占领长安，一年后建立唐朝","themes":["待时而动","联盟","转型","时机","定位","改弦更张","借势"],"pros":["天下已乱而隋室名义仍在，你举尊隋的旗号，先把最容易被攻击的篡位口实挡住了。","李世民与刘文静先谋、裴寂等人响应，你等到中央真正失控才动手，时机没有浪费。","打着尊隋的旗号，关中守臣不必立刻与你死战，入关的路因此顺畅。"],"cons":["旗号借的是隋室的名分，你要自己称帝时这块招牌必须立刻换掉，中间不能有半步迟疑。","名义上尊隋，就给了部下与外人揣测你真实意图的空间，队伍靠的还是利益与时机。","这套做法只在中央彻底失控时成立，隋室若还有镇压之力，同样的起兵就是自寻死路。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·隐太子建成传","title":"玄武门之变","original":"六月四日，太宗将左右九人至玄武门自卫。……建成、元吉至临湖殿，觉变，即回马，将东归宫府。太宗从而呼之，元吉……引弓射太宗，再三不彀。","translation":"六月四日，太宗带左右九人到玄武门自卫。……建成、元吉到临湖殿，察觉有变，立即回马，准备东回宫府。太宗跟上去呼喊，元吉……拉弓射太宗，再三拉不开弓。","figures":["李世民","李建成","李元吉","李渊"],"decision":"在继承权竞争中判断无法通过制度途径取胜，选择在对手未准备时一次解决","outcome":"李世民夺位成功，开创贞观之治，但开了唐代宫廷政变的先例","themes":["内部矛盾","决断","派系斗争","窗口期","夺嫡","骨肉相残","同室操戈","先发制人","家族内斗"],"pros":["你判断制度途径已经走不通，先在玄武门设伏，抢到了对方还没动手的那个窗口。","一次解决，避免了长期对峙把整个朝廷拖进持续内耗。","元吉再三拉不开弓，说明对方确实没有准备，你选的日子与地点都是对的。"],"cons":["杀了兄长和弟弟才拿到位置，此后所有政绩都得背着这笔账，合法性只能靠治绩来补。","开了宫廷政变夺位的先例，唐代后来的继承动荡都从这里取了样。","以兵变解决继承问题，前提是你已掌握宫中宿卫，换个没有兵权的皇子照做就是送死。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"贞观政要·论君道","title":"贞观君臣论守成","original":"太宗曰：「……天子者，有道则人推而为主，无道则人弃而不用，诚可畏也。」魏征曰：「……君，舟也；人，水也。水能载舟，亦能覆舟。」","translation":"太宗说：……天子这个位置，有道义人们就推举他为主，没有道义人们就抛弃不用，实在可怕。魏征说：……君主是船，百姓是水。水能载舟，亦能覆舟。","figures":["唐太宗","魏征"],"decision":"把「位置本身不安全」作为日常议政的前提，主动维持一个稳定的批评渠道","outcome":"贞观年间纳谏成风，决策质量与民生同步改善","themes":["宽政","民心","言路","得民心","纳谏","收揽人心","失民心"],"pros":["你承认位置本身不安全，就等于把臣下指出你的错，从冒犯变成了分内事。","魏征这类人敢把水能覆舟的话当面说透，是因为你长期没有因逆耳之言动怒。","批评渠道稳定，问题能在还小的时候被说出来，改起来的代价就小。"],"cons":["这套做法完全依赖你个人的克制，你一旦不耐烦，船与水的话立刻变成犯上。","把安危挂在人心上，就得长期维持宽政与纳谏的姿态，任何一次纳谏失灵都会被读成转向。","渠道靠的是肯开口的人，这样的人不会自己出现，你得持续留位置并护住他们。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"贞观政要·论任贤","title":"太宗用人不问亲疏","original":"太宗曰：「……君子用人如器，各取所长。……今人臣之才，虽未必兼备，若随器授任，则无遗才矣。」","translation":"太宗说：……君子用人像用器具，各取所长。……如今臣下的才能虽未必兼备，如果按器量授予职务，就不会有被遗漏的人才。","figures":["唐太宗","房玄龄","杜如晦","魏征"],"decision":"以岗位需求匹配个体长处，而不是要求每人都是全能来完成组织目标","outcome":"贞观朝人才济济，形成互补性极强的决策团队","themes":["招才","用人","识人","举贤","不拘一格","纳士","团队互补"],"pros":["把岗位需求与个人长处对齐，房玄龄、杜如晦、魏征各自的长处都能用上。","不要求臣下全能，可用之人的范围立刻扩大，能进来的人远比整齐划一的标准下多。"],"cons":["按器授任的前提是你分得清谁擅长什么，看错一次，长处就变成错位。","各取所长拼起来的班子，需要有人把长处合到一处，否则强人越多越难协调。","不求全责备，就要容忍某些人在品行上的毛病，用与不用之间你得自己划线。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·魏征传","title":"以人为镜","original":"太宗谓侍臣曰：「夫以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。朕常保此三镜，以防己过。」","translation":"唐太宗对身边大臣说：用铜作镜子，可以端正衣冠；用历史作镜子，可以知道兴衰更替；用人作镜子，可以明白得失。我常保有这三面镜子，以防自己犯错。","figures":["唐太宗","魏征"],"decision":"制度化地保留一个专职提反对意见的角色，并把批评视为资产而非威胁","outcome":"魏征死后太宗叹失一镜，贞观谏议之风成后世典范","themes":["拒谏","招才","用人","言路","不听谏","纳谏","亲贤臣","举贤"],"pros":["你专门留一个位置给提反对意见的人，你的错就有了被提前说出来的机会。","把批评当资产而不是威胁，魏征这类人才敢把话说到你不想听的那一层。","铜镜、古镜、人镜并列，等于你承认自己判断会出错，这让人敢反驳你。"],"cons":["人镜是会死的，魏征一死，你身边就再没有一面能照出得失的镜子。","这套办法靠你愿意听真话，换一个受不了逆耳的君主，同一个人立刻变成罪臣。","把批评制度化，就得长期忍受当众被驳，任何一次发作都会让后面的人闭嘴。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·房玄龄传","title":"房谋杜断","original":"时人语曰：「房谋杜断。」盖玄龄善建嘉谋，如晦能断大事也。……玄龄……不以己长望人，取人不求备。","translation":"当时人说：「房谋杜断。」因为房玄龄善于提出好谋略，杜如晦能决断大事。……房玄龄……不拿自己的长处去要求别人，用人不求全责备。","figures":["房玄龄","杜如晦","唐太宗"],"decision":"把「谋划」与「决断」拆成两个角色分派给不同的人，并让两人长期配对协作","outcome":"贞观政事运转高效，成为分工协作的经典范式","themes":["决断","授权","用人","识人","团队互补","分工","决策"],"pros":["谋划与决断分给两个人，房玄龄的长处不被决断的压力磨掉，杜如晦也不必从头想方案。","两人长期配对，方案到决断之间的交接几乎没有损耗，政事运转因此快。"],"cons":["这套分工靠两人长期合得来，任何一方更换，谋划与决断之间就会重新出现断层。","把决断权单独交给一个人，是他能断大事的前提，也是他判断偏了没人拦得住的原因。","分工越固定，越依赖你同时握住这两个人，一旦一方坐大，配对就成了结党。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·李靖传","title":"李靖夜袭阴山","original":"靖……「今……突厥……必谓我兵不能至，若选精骑一万，赍二十日粮，……可擒也。」……遂……大破之。","translation":"李靖……「如今……突厥……必定认为我军不能到达，如果选精骑一万，带二十日粮，……可以擒获他。」……于是……大破突厥。","figures":["李靖","唐太宗","颉利可汗"],"decision":"在对手因和谈而松懈的判断上做文章，用己方可承受的有限兵力换取决定性胜利","outcome":"东突厥灭亡，唐朝北方威胁解除，被尊为天可汗","themes":["决断","待时而动","轻敌","避实击虚","奇袭","以少胜多","抓住时机","疏于防备"],"pros":["你抓住对方因和谈而松懈的判断，选精骑一万、二十日粮，本钱压在可承受的范围内。","用少数精骑换决定性胜利，避开了正面硬拼的消耗。","突厥认定唐兵到不了，你偏在这一点上下注，突然性就是你全部的优势。"],"cons":["这支兵只带二十日粮，打不中就回不来，胜败全押在一次奇袭是否得手。","你赌的是颉利可汗确实松懈，一旦对方有备，一万骑兵就是送上门的。","不经和谈程序直接动手，赢了是奇功，输了就是把朝廷的和议招牌一并砸掉。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·长孙无忌传","title":"长孙无忌的权势与结局","original":"……无忌……以元舅之亲，……威权日盛。……及高宗立武氏，无忌……竟以谋反诛，籍没其家。","translation":"……长孙无忌……凭元舅的亲属关系，……威权一天天强盛。……等到高宗立武则天为后，长孙无忌……最终以谋反罪被诛，家产被没收。","figures":["长孙无忌","唐高宗","武则天","褚遂良"],"decision":"长期以亲属关系与拥立之功维持影响力，未在权力结构变化时主动调整位置","outcome":"被构陷谋反赐死，关陇集团遭受致命打击","themes":["亲信","内部矛盾","功高震主","误判","谗言构陷","被构陷","亲属政治","内部倾轧","误判形势","兔死狗烹"],"pros":["凭元舅的亲属关系与拥立之功，你在高宗朝前期确实握有别人比不上的话语权。","长期维持这种影响力，靠的是高宗对旧臣的倚重，这段时间里你的意见几乎无人能驳。"],"cons":["你靠亲属关系与旧功立身，一旦高宗要自立，这两个依据都会变成你越权的证据。","立武氏这件事你站在旧秩序一边，权力结构变了而你位置没动，冲突就无处回避。","威权日盛却没有退路安排，最后被以谋反罪诛、家产籍没，是这条路走到头的代价。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·褚遂良传","title":"褚遂良叩血谏立后","original":"遂良曰：「……陛下必欲易皇后，伏请妙择天下令族，何必武氏。」……「还陛下笏，乞放归田里。」……因置笏于殿阶，解巾叩头流血。","translation":"褚遂良说：……陛下一定要更换皇后，恳请从天下名门中好好挑选，何必一定要武氏。……「把笏板还给陛下，请求放我回乡。」……于是把笏板放在殿阶上，解下头巾叩头流血。","figures":["褚遂良","唐高宗","武则天","长孙无忌"],"decision":"用极端方式表达反对，但只提原则不提替代方案与代价评估","outcome":"被贬而死，武则天立后成功，反对派被系统性清除","themes":["内部矛盾","拒谏","言路","误判","避实击虚","纳谏","无效抗争","内部倾轧","误判形势"],"pros":["你用叩头流血把反对推到最重，至少让高宗知道这件事的阻力有多大。","你维护的是名门择后这个原则，把话说明白了，日后在历史上你站得住。"],"cons":["只提原则不提替代方案，也不评估硬顶的代价，反对就只剩下姿态。","以叩血相争，把可回旋的空间一次用尽，你被贬而死，武则天立后照样成功。","反对派没有统一的退路安排，你一出局，同气的人被系统性清除，连累面极大。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·狄仁杰传","title":"狄仁杰荐贤与复唐","original":"仁杰……「臣所荐……桓彦范、敬晖……张柬之……」……「天下桃李，悉在公门矣。」仁杰曰：「荐贤为国，非为私也。」","translation":"狄仁杰……「臣所推荐的是……桓彦范、敬晖……张柬之……」……「天下的人才，都在您门下了。」狄仁杰说：「推荐贤才是为国家，不是为私人。」","figures":["狄仁杰","武则天","张柬之","桓彦范"],"decision":"在女性君主掌权的复杂局面中不正面冲突，而是持续把合适的人放到关键位置","outcome":"神龙政变成功，唐朝复辟，狄仁杰被追封为梁国公","themes":["招才","止损","用人","蓄力","长期主义","举贤","长期布局","以退为进","隐忍","纳士"],"pros":["你不与武则天正面冲突，把力气花在把合适的人放到关键位置，风险小、积累久。","张柬之、桓彦范、敬晖这些人由你荐上去，政变成功时他们已在能动手的位置。","荐贤为国不为私，使武则天明知你心向唐室仍用你，这就是你长期布局的空间。"],"cons":["这条路要你活得够久、位置够稳，任何一次失宠，布局就断在半途。","把复唐的希望全押在人事安排上，你生前看不到结果，成效取决于被荐者敢不敢动手。","不正面冲突意味着你要长期在武氏朝中任职，这份含糊日后必被人拿来说事。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·姚崇传","title":"姚崇十事要说","original":"崇……因跪奏……「臣愿以十事闻，陛下度不可行，臣敢辞。」……上曰：「朕能行之。」崇乃顿首谢。翌日，拜兵部尚书、同中书门下三品。","translation":"姚崇……于是跪奏……「臣希望把十件事报告陛下，陛下考虑如不能实行，臣斗胆请辞。」……皇上说：「朕能做到。」姚崇才叩头谢恩。次日，被任命为兵部尚书、同中书门下三品。","figures":["姚崇","唐玄宗"],"decision":"在上任前先把授权条件与政策边界谈清楚，把「先授权后干活」变成正式的谈判","outcome":"开元初年改革顺利推行，成就开元盛世","themes":["定制度","授权","改革受阻","标准化","谈判","改革推不动","立规","对齐预期"],"pros":["上任前先把十件事讲定，要皇帝一句朕能行之，往后推改革就拿这句承诺开路。","把授权条件谈清楚，你推进时遇到的阻力可以明确回推到御前的表态上。","谈不成就不受任，这个退出选项本身让你的条件有分量。"],"cons":["条件谈得越明白，越把皇帝绑在具体承诺上，他一旦反悔，你立刻成为被追责的对象。","十件事一次讲定，只能覆盖你事前想得到的范围，没列进去的新问题就没有授权依据。","这套办法靠皇帝肯当面点头，遇上不愿被约束的君主，跪奏十事就是自断后路。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·宋璟传","title":"宋璟守法不阿","original":"……璟为相，……「刑赏无私，敢犯颜直谏。」……「（宋）璟……守法持正。」","translation":"……宋璟任宰相，……「刑罚赏赐不徇私情，敢于冒犯君王直言进谏。」……宋璟……守法令持公正。","figures":["宋璟","唐玄宗","姚崇"],"decision":"在盛世期坚持按规则办事、拒绝为人情开口子，保护制度的可信度","outcome":"与姚崇并称「姚宋」，共同支撑开元之治","themes":["务实","定制度","拒谏","激励士气","制度约束","明法度","赏罚分明","立规","公正"],"pros":["盛世里人情最难挡，你坚持刑赏无私，制度的可信度就不会被人情一点点磨掉。","敢犯颜直谏，使开元前期的用人赏罚有了一套谁都能预期的标准。","你与姚崇一个立法一个守成，规则才不只是写在纸上的条文。"],"cons":["守法不阿就意味着你要一次次驳回人情，你在朝中的敌意是持续累积的。","规则守得越硬，越需要皇帝始终站在你这边，他一嫌你碍事，标准就从你身上先破。","一概不徇私情，遇到确实需要变通的边事，你手上就没有可用的余地了。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·李林甫传","title":"李林甫口蜜腹剑","original":"林甫……「尤忌文学之士，或阳与之善，啖以甘言，而阴陷之。」世谓李林甫「口有蜜，腹有剑」。……「自是谏诤路绝矣。」","translation":"李林甫……尤其忌恨文学之士，有的表面与他交好，用甜言引诱，暗地里却陷害他。世人说李林甫「口有蜜，腹有剑」。……「从此谏诤的路断绝了。」","figures":["李林甫","唐玄宗","张九龄","牛仙客"],"decision":"为独占信息通道，系统性地把有能力提出异议的人排挤出决策圈","outcome":"朝中再无人敢言，边镇节度使权力失控，安史之乱由此埋下根","themes":["内部矛盾","拒谏","言路","谗言构陷","骨干离职","信息封锁","构陷","谗言","内部倾轧","疏远谋臣"],"pros":["把张九龄这类敢提异议的人排出去，你对玄宗说的话短期内确实没有人能反驳。","信息通道收归自己，你的相位在很长时间里没有受到有效挑战。"],"cons":["异议被清干净之后，玄宗听到的全是你筛选过的消息，边镇失控这种大事再也传不上去。","谏诤路绝之后，你成了所有坏消息唯一的通路，问题爆发时责任无处转嫁。","用构陷的方式处理同僚，等于把朝廷的争斗规则降到最低，后来者照此对你也不会有余地。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·安禄山传","title":"安史之乱","original":"禄山……「臣蕃人，不识文字，陛下擢臣不次。」……「既有其土地，又有其人民，又有其甲兵，又有其财赋，以布列天下。」……遂反。","translation":"安禄山……「臣是蕃人，不识字，陛下破格提拔臣。」……「既占有土地，又占有人民，又拥有甲兵，又掌握财赋，分布于天下。」……于是反叛。","figures":["安禄山","唐玄宗","杨国忠","李林甫"],"decision":"为制衡宰相而长期把军权、财权、人事权集中授予边将，不设制衡与轮换","outcome":"安史之乱八年，唐朝由盛转衰，藩镇割据延续百余年","themes":["将不受命","授权","管理失控","尾大不掉","组织膨胀","分权失衡"],"pros":["军权、财权、人事一并交给边将，边镇办事极快，开元年间的边功靠这套办法撑起来。","用边将的兵力牵制朝中宰相，朝内权力在你手里一度是平衡的。"],"cons":["土地、人民、甲兵、财赋都归一人，边镇就具备了独立起兵的全部条件。","不设轮换与制衡，节度使在一地越久越像本地之主，朝廷的命令要看他愿不愿意听。","这套安排只在你压得住这些人的时候成立，安禄山一反，八年战乱与百余年藩镇割据都由它而来。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·郭子仪传","title":"郭子仪单骑退敌","original":"子仪……「今众寡不敌，难以力胜。昔与回纥契约甚厚，不若挺身往说之。」……回纥……「果吾父也。」……皆下马罗拜。","translation":"郭子仪……「如今众寡不敌，难以力胜。从前与回纥有很厚的盟约，不如挺身前去劝说。」……回纥……「果然是我们的父辈。」……都下马围绕下拜。","figures":["郭子仪","回纥可汗","仆固怀恩","唐代宗"],"decision":"在军事劣势下动用长期积累的个人信誉资产，用一次面谈化解联盟危机","outcome":"回纥退兵并倒向唐朝，长安转危为安","themes":["口碑","失信","联盟","谈判","避实击虚","长期主义","信誉","以弱胜强"],"pros":["众寡不敌时你改用力胜为说服，避开了打不赢的正面仗。","你与回纥旧有厚约，这份长期积累的信誉，只有你本人到场才取得出来。","回纥下马罗拜并倒向唐朝，长安转危为安，一次面谈换来的东西比一支兵多。"],"cons":["你单骑入营，命完全握在对方手里，回纥若不受这份旧情，你当场就没了。","这条路只在你个人的信誉还立得住时有效，换个没这份账的人去谈，同样的盟约一文不值。","靠个人信誉救得了一次，就掩盖了朝廷兵力不足这件事，下一回危机还要靠你再冒一次险。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·颜真卿传","title":"颜真卿殉节","original":"真卿……「……吾守吾节，死而后已。」……希烈……「即使人……缢杀之。」……「年七十七。」","translation":"颜真卿……「……我守住我的节操，死而后已。」……李希烈……「于是派人……把他缢杀。」……「享年七十七岁。」","figures":["颜真卿","李希烈","唐德宗"],"decision":"在奉命劝降叛将时坚持不接受收买，明知风险仍前往","outcome":"被杀殉节，其书法与人品同被后世推崇","themes":["务实","失信","孤注一掷","心理战","蓄力","长期主义","坚守","气节","以身涉险","刚正","信用"],"pros":["你守节到底，李希烈的收买在你身上没有起作用，叛将少了一块可用的招牌。","死而后已这四个字你做到了，后世推重你的人品，与你的书法并列传下来。"],"cons":["明知去劝降有去无回还是去了，你这条有用的命换来的，只是对方背上杀使的名声。","气节立得住你自己，却挡不住李希烈动手，人一死，劝降这件事本身也失败了。","把生还的可能完全排除，等于放弃了日后再为朝廷出力的全部机会。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·陆贽传","title":"陆贽罪己诏","original":"贽……「……悔过之意不得不深，引咎之辞不得不尽。」……「……德宗……痛自刻责。」","translation":"陆贽……「……悔过之意不能不深，引咎之辞不能不尽。」……德宗……痛切自我责备。","figures":["陆贽","唐德宗","李怀光"],"decision":"在兵变压力下选择公开发布自我检讨，用承担责任的姿态换取人心与时间","outcome":"部分挽回了朝廷声望，德宗得以稳住局面","themes":["决断","危机公关","口碑","止损","民心","承担责任","收揽人心"],"pros":["兵变压力下你选择公开自责，悔过之意写得深、引咎之辞写得尽，人心最容易在这里被拉回。","把责任先接到自己身上，李怀光等人起兵的旗号就少了一层理直气壮。","朝廷声望部分挽回，你就换到了稳住局面的时间。"],"cons":["罪己诏的分量在于你日后真的改，过错照旧，这份公开检讨反成被反复引用的把柄。","把责任全揽过来，等于让真正该负责的人从这件事里脱了身。","这招只能用一次两次，用多了就不再有人信你是痛自刻责。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·裴度传","title":"裴度督师平淮西","original":"度……「臣誓不与贼俱生。」……「……（度）虽……中伤，而……不动。」……李愬……雪夜入蔡州。","translation":"裴度……「臣发誓不与贼人同生。」……裴度虽然……被中伤，而……不动摇。……李愬……雪夜袭入蔡州。","figures":["裴度","李愬","吴元济","唐宪宗"],"decision":"在多次战败、朝中主和声浪高涨时坚持既定目标，并把前线指挥权交给敢于冒险的将领","outcome":"淮西平定，藩镇相继归顺，史称元和中兴","themes":["决断","心理战","授权","蓄力","避实击虚","长期主义","坚持","抗压","奇袭"],"pros":["多次战败、朝中主和声浪高涨时你不改目标，前线才没有被中途叫停。","把指挥权交给敢冒险的李愬，雪夜入蔡州这种打法只有放手才可能出现。","你在被中伤时不动摇，宪宗朝的平藩意志才有了可以依靠的支点。"],"cons":["坚持既定目标的前提是资源还撑得住，淮西若再拖几年，你和主和派的位置会一起翻转。","把指挥权交出去，功劳与风险同时外移，淮西若败，中伤你的人立刻有了实证。","抗压靠的是宪宗的信任，这份信任一松动，你的坚持就会被重新说成固执。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·李愬传","title":"雪夜入蔡州","original":"……夜半……雪愈甚。……「……入蔡州取吴元济。」……「时大风雪，旌旗裂，人马冻死者相望。」……元济……「尚寝……不为备。」","translation":"……半夜……雪更大了。……「……进蔡州捉吴元济。」……当时大风雪，旗帜被吹裂，人马冻死的随处可见。……吴元济……还在睡觉……毫无防备。","figures":["李愬","吴元济","裴度"],"decision":"在所有人都认为不可能出兵的极端天气下行动，用对手的常识判断盲区换取突然性","outcome":"一夜之间擒获吴元济，淮西平定","themes":["决断","窗口期","轻敌","避实击虚","奇袭","疏于防备","以少胜多"],"pros":["所有人都认为这种天气不会出兵，你偏在此时动身，突然性就来自这里。","吴元济尚在睡觉、毫无防备，你一夜之间擒住了他，淮西由此平定。","风雪既是代价也是掩护，你把它当成条件而不是阻碍。"],"cons":["大风雪里旌旗被吹裂、人马冻死者相望，这支队伍能到蔡州本身就有运气成分。","赌的是对手按常识判断你不敢出，一旦吴元济当夜设有戒备，冻损过半的兵就是送上门的。","全军押在一次奔袭上，中途被察觉就没有第二套方案可用。"],"verdict":"","verdictWhy":""},{"book":"隋唐五代","chapter":"旧唐书·李德裕传","title":"牛李党争","original":"……德裕……与……牛僧孺……「各分朋党，更相倾轧，垂四十年。」……「士大夫……各有所附，非其党则摈之。」","translation":"……李德裕……与……牛僧孺……「各自分列朋党，互相倾轧，持续近四十年。」……「士大夫……各有所依附，不是自己一党的就排斥。」","figures":["李德裕","牛僧孺","唐文宗","唐武宗"],"decision":"把人事任免与政策选择绑定在派系归属上，用站队替代能力评价","outcome":"朝政空转近四十年，唐朝失去最后的改革窗口","themes":["内部矛盾","派系斗争","猜忌","识人","内部倾轧","站队","组织内耗","识人不明","上下离心"],"pros":["把人事与政策绑在派系上，你得势时可以快速换掉一批人，推行自己的主张。","同党互相援引，你这一派在近四十年里始终有人接得上位置。"],"cons":["用站队替代能力评价，不是自己一党的就排斥，可用的能人有一半被挡在门外。","双方
